# Queue of the ingest gateway (`closeyourit enable ingest`). The password comes from ingest/nats.env.
server_name: closeyourit-ingest
listen: 0.0.0.0:4222
http: 127.0.0.1:8222

jetstream {
  store_dir: /data/jetstream
  max_mem_store: 256MB
  # The gateway queue (4 GB) plus the undeliverable requests (1 GB).
  max_file_store: 6GB
}

authorization {
  user: ingest
  password: $NATS_PASSWORD
  timeout: 2
}

max_payload: 8MB
