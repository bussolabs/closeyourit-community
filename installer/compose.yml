# CloseYourIt on one server (CYRA-919). Written to /opt/closeyourit by install.sh; the values come
# from /opt/closeyourit/.env. Change settings there, then `closeyourit restart`.
#
# Default services: app, worker, postgres, caddy. The `ingest` profile adds the gateway and its
# queue (`closeyourit enable ingest`).
name: closeyourit

x-environment: &environment
  RAILS_ENV: production
  APP_GIT_TAG: v${CLOSEYOURIT_VERSION:?set by install.sh}
  # Turns on the update notice and the Update now button for the administrator (CYRA-1035).
  CLOSEYOURIT_SELF_HOSTED: "true"
  DATABASE_URL: postgres://closeyourit:${POSTGRES_PASSWORD}@postgres:5432/closeyourit
  QUEUE_DATABASE_URL: postgres://closeyourit:${POSTGRES_PASSWORD}@postgres:5432/closeyourit_queue
  CACHE_DATABASE_URL: postgres://closeyourit:${POSTGRES_PASSWORD}@postgres:5432/closeyourit_cache
  CABLE_DATABASE_URL: postgres://closeyourit:${POSTGRES_PASSWORD}@postgres:5432/closeyourit_cable

x-app: &app
  image: ${CLOSEYOURIT_IMAGE:-ghcr.io/bussolabs/closeyourit}:${CLOSEYOURIT_VERSION:?set by install.sh}
  restart: unless-stopped
  env_file: .env
  volumes:
    - storage:/rails/storage

services:
  app:
    <<: *app
    environment:
      <<: *environment
      SOLID_QUEUE_IN_PUMA: "false"
    # Update requests go out through inbox; the host answers in status, read-only here (CYRA-1035).
    volumes:
      - storage:/rails/storage
      - ./updates/inbox:/rails/updates/inbox
      - ./updates/status:/rails/updates/status:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ["./bin/jobs"]
    # The image healthcheck asks for HTTP on :80, which the worker does not serve.
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
    environment:
      <<: *environment
      RAILS_MAX_THREADS: "10"
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: closeyourit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: closeyourit
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closeyourit -d closeyourit"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Where /api/* goes: the app, or the gateway once `closeyourit enable ingest` ran.
      INGEST_UPSTREAM: ${INGEST_UPSTREAM:-app:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  nats:
    profiles: ["ingest"]
    image: nats:2.14.3-alpine
    restart: unless-stopped
    command: ["--config", "/etc/nats/nats.conf"]
    env_file: ./ingest/nats.env
    volumes:
      - ./ingest/nats.conf:/etc/nats/nats.conf:ro
      - nats:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 3s
      retries: 12

  gateway:
    profiles: ["ingest"]
    image: ghcr.io/bussolabs/closeyourit-ingest:${INGEST_VERSION:-latest}
    restart: unless-stopped
    environment:
      LISTEN_ADDRESS: ":8080"
      METRICS_LISTEN_ADDRESS: "127.0.0.1:9101"
      APP_ENV: production
      # The host name the app answers on, dialled straight to the app container: no TLS inside.
      UPSTREAM_URL: http://${DOMAIN}
      UPSTREAM_DIAL_ADDRESS: app:80
      # 4 GB of queue, room for hours of an outage on a small disk (the production gateway has 25).
      QUEUE_MAX_BYTES: "4294967296"
      NATS_URL: nats://nats:4222
      NATS_USER: ingest
      NATS_PASSWORD_FILE: /run/secrets/nats_password
      ENVELOPE_KEY_FILE: /run/secrets/envelope_key
    secrets:
      - nats_password
      - envelope_key
    depends_on:
      nats:
        condition: service_healthy

secrets:
  nats_password:
    file: ./ingest/nats_password
  envelope_key:
    file: ./ingest/envelope_key

volumes:
  postgres:
  storage:
  caddy-data:
  caddy-config:
  nats:
