# Builds the Docker image of each release and publishes it on GitHub Packages:
# ghcr.io/bussolabs/closeyourit:<version> and :latest. The installer pulls these.
# Then it creates the GitHub release: the installer asks for the latest release, so a version
# becomes installable only once its image exists.
name: Image

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

concurrency:
  group: community-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'bussolabs/closeyourit-community'
    # GitHub-hosted: a public repository must never reach the private runner pool (CYRA-914).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version without the leading v
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/bussolabs/closeyourit:${{ steps.version.outputs.number }}
            ghcr.io/bussolabs/closeyourit:latest
      - name: Release, now that the image exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes "Install or update: https://closeyour.it/docs/installation"
