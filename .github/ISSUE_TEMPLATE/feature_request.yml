name: Feature request
description: Describe a problem and the outcome you need.
title: "[Feature]: "
assignees: [bussolarialessio]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who encounters the problem, and in which situation?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should someone be able to do? Include an example of success.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing workarounds and why they are insufficient.
