it:
  # Formati data/ora. `default`/`short`/`long` NON sono un vezzo: Rails li fornisce d'ufficio solo
  # per l'inglese e questo progetto non monta rails-i18n, quindi in italiano `l(time, format: :short)`
  # — usato in una trentina di punti fra view e componenti — sollevava I18n::MissingTranslationData,
  # cioè una 500 su ogni pagina che stampa un istante per un account con lingua italiana.
  # Tutto numerico di proposito: `%b` chiederebbe `date.abbr_month_names` in italiano, che non c'è,
  # e stamperebbe i mesi in inglese in mezzo a una pagina italiana.
  # I `chart_*` restano per gli assi/tooltip dei chart di monitoring.
  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d/%m %H:%M"
      long: "%d/%m/%Y %H:%M"
      chart_time: "%H:%M"
      chart_day: "%d/%m"
      # CYRA-500: sull'arco di un anno la tacca dice anche in che anno si trova.
      chart_year: "%d/%m/%y"
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d/%m"
      long: "%d/%m/%Y"
      # CYRA-324 — forma breve con il giorno della settimana per le card («lun 5 ago»): a qualche
      # giorno di distanza dice quando è successo senza costringere a fare il conto.
      card: "%a %-d %b"
      day: "%A %-d %B"
      # CYRA-497 — le scadenze e le date dei documenti erano scritte a mano con strftime, che non
      # guarda la lingua: uscivano «09 Aug 15:14» e «Aug 9». Passando dai formati, i mesi restano
      # quelli sopra, in italiano, ovunque.
      day_month: "%-d %b"
      day_month_year: "%-d %b %Y"
    abbr_day_names: [dom, lun, mar, mer, gio, ven, sab]
    day_names: [domenica, lunedì, martedì, mercoledì, giovedì, venerdì, sabato]
    abbr_month_names: [~, gen, feb, mar, apr, mag, giu, lug, ago, set, ott, nov, dic]
    month_names: [~, gennaio, febbraio, marzo, aprile, maggio, giugno, luglio, agosto, settembre, ottobre, novembre, dicembre]
  # CYRA-392 — durate relative in italiano per `time_ago_in_words` / `distance_of_time_in_words`.
  # Rails le fornisce d'ufficio solo in inglese e qui manca rails-i18n, quindi senza queste chiavi ogni
  # "tempo fa" (ticket, monitoring, uptime, server, agenti) usciva in inglese ("about 3 hours", "10 days")
  # in mezzo a una pagina italiana. Valori canonici rails-i18n.
  datetime:
    distance_in_words:
      half_a_minute: mezzo minuto
      less_than_x_seconds:
        one: meno di un secondo
        other: meno di %{count} secondi
      x_seconds:
        one: un secondo
        other: "%{count} secondi"
      less_than_x_minutes:
        one: meno di un minuto
        other: meno di %{count} minuti
      x_minutes:
        one: un minuto
        other: "%{count} minuti"
      about_x_hours:
        one: circa un'ora
        other: circa %{count} ore
      x_days:
        one: un giorno
        other: "%{count} giorni"
      about_x_months:
        one: circa un mese
        other: circa %{count} mesi
      x_months:
        one: un mese
        other: "%{count} mesi"
      about_x_years:
        one: circa un anno
        other: circa %{count} anni
      over_x_years:
        one: più di un anno
        other: più di %{count} anni
      almost_x_years:
        one: quasi un anno
        other: quasi %{count} anni
      x_years:
        one: un anno
        other: "%{count} anni"
  # CYRA-568 — numeri all'italiana. Stesso motivo delle date qui sopra: senza rails-i18n la locale
  # italiana cadeva sui default inglesi di Rails, quindi «2841» usciva «2,841» — che un lettore
  # italiano legge come due virgola otto — e «1.5 MB» invece di «1,5 MB». Vale per tutto ciò che
  # passa da un helper numerico (`number_with_delimiter`, `number_to_percentage`,
  # `number_to_human_size`): un posto solo per l'intero prodotto.
  number:
    format:
      delimiter: "."
      separator: ","
      precision: 3
      significant: false
      strip_insignificant_zeros: false
    # I namespace derivati vanno RIDICHIARATI: ActiveSupport fonde `number.format` sopra i default
    # di ciascuno, quindi le regole dei conteggi (tre cifre, nessuno zero tolto) arrivano ai byte e
    # ai soldi — «1,500 KB» dove si leggeva «1,5 KB», tre decimali su un prezzo. Valori canonici
    # rails-i18n. Le unità italiane tolgono anche l'ultimo residuo inglese: «512 Bytes».
    human:
      format:
        delimiter: ""
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: Byte
            other: Byte
          kb: KB
          mb: MB
          gb: GB
          tb: TB
    currency:
      format:
        precision: 2
        significant: false
        strip_insignificant_zeros: false
  # CYRA-568 — «Scadenza and Assegnatario»: `to_sentence` unisce con la congiunzione della lingua e
  # senza queste chiavi usava quella inglese in mezzo a una frase italiana. In italiano l'ultimo
  # elemento non vuole la virgola prima della e, quindi i due connettori finali coincidono.
  support:
    array:
      words_connector: ", "
      two_words_connector: " e "
      last_word_connector: " e "
  # Fallback per i simboli di validazione custom (no rails-i18n nel progetto): evita
