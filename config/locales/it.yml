      delegation_conflict: "il progetto riceve già un altro secret dell'organizzazione con questo nome in questo ambiente"
      length_budget_exceeded: "supera il limite di %{count} caratteri (adesso sono %{actual}): accorcia il testo o spezzalo in più parti"
  pagination:
    per_page: "righe:"
    info: "%{from}–%{to} di %{total}"
    previous: "Precedente"
    next: "Successivo"
  shared:
    skip_to_content: "Vai al contenuto"
    modal_label: "Modulo"
    modal_loading: "Caricamento…"
    scroll_horizontal: "Scorri per vedere altro"
    # CYRA-656 — la colonna dei riferimenti del progetto, uguale su ogni pagina che ne ha uno.
    # CYRA-442: parole d'interfaccia che vivevano dentro il markup o dentro il JS, dove nessuna
    # scelta di lingua le raggiungeva.
    actions_cancel: "Annulla"
