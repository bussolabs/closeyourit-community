    code_block:
      copy: "Copia"
      copied: "Copiato"
    actions:
      close: "Chiudi"
      row_menu: "Azioni riga"
    # CYRA-570: la frase con cui un grafico dichiara di non avere niente da disegnare nel periodo.
    # Generica di proposito — chi ha una parola più precisa (messaggi, visite, occorrenze) la passa.
    histogram:
