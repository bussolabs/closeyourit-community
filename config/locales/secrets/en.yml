en:
  secrets:
    notifications:
      content:
        title: "The secret %{name} in project %{project} (%{environment}) needs rotation"
        deleted_title: "The secret %{name} (project %{project}, environment %{environment}) was deleted by %{actor}"
        deleted_body: The secret is no longer available in this environment.
        unknown_actor: a team member
        sync_failed_title: "The GitHub secrets sync for project %{project} failed"
        sync_failed_body: Check the project's GitHub configuration.
        sync_failed_body_with_reason: "Reason: %{reason}. Check the project's GitHub configuration."
        change_requested_title: "%{requester} requested to %{action} the secret %{name} (project %{project}, environment %{environment})"
        change_requested_body: The request is waiting for your approval.
        change_approved_title: "Your change request for the secret %{name} (project %{project}, environment %{environment}) was approved"
        change_approved_body: The change has been applied to the secret.
        change_rejected_title: "Your change request for the secret %{name} (project %{project}, environment %{environment}) was rejected"
        change_rejected_body: "Reason: %{reason}"
        action_labels:
          set: set
          remove: delete
        consolidation_title: "The same value is repeated across %{count} projects (%{environment})"
        consolidation_body: "You can move it into the organization secrets once: every project keeps calling it the way it does today."
    secret_notifications:
      mailer:
        notify:
          subject: "[Vault] %{title}"
          greeting: "Hi,"
          action: View rotation
          footer: You receive this because you manage secrets on this project. Manage notifications in your preferences.
          label_project: "Project"
          label_environment: "Environment"
