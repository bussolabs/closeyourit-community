it:
  secrets:
    notifications:
      content:
        title: "Il secret %{name} del progetto %{project} (%{environment}) va ruotato"
        deleted_title: "Il secret %{name} (progetto %{project}, ambiente %{environment}) è stato cancellato da %{actor}"
        deleted_body: Il secret non è più disponibile in questo ambiente.
        unknown_actor: un membro del team
        sync_failed_title: "La sincronizzazione dei secret del progetto %{project} verso GitHub non è riuscita"
