    # CYRA-570: how a chart states it has nothing to draw for the period. Deliberately generic —
    # callers with a sharper word (messages, visits, occurrences) pass their own.
    histogram:
      empty: "No data in this period."
    # Live character counter next to long text fields (Stimulus char-counter): the JS composes
