# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  # Compact formats for the monitoring chart axes/tooltip (l(time, format: :chart_*)).
  time:
    formats:
      chart_time: "%H:%M"
      chart_day: "%d/%m"
      chart_year: "%d/%m/%y"
  # CYRA-324 — short form with the weekday for the cards ("Mon 5 Aug"): past a few days it says when
  # something happened without making you do the arithmetic. Rails' English defaults cover the names.
  date:
    formats:
      card: "%a %-d %b"
      day_month: "%b %-d"
      day_month_year: "%b %-d, %Y"
  # Fallback per i simboli di validazione custom (no rails-i18n nel progetto): evita
  # "translation missing" nei messaggi d'errore dei model. Vedi concern Attachable / Ticket / Comment.
  errors:
    messages:
      not_member: "is not a member of this organization"
      same_idea: "is the idea itself"
      other_project: "belongs to another project"
      already_linked: "is already linked to this idea"
      is_evolution: "is already the evolution of another idea: evolutions have a single level"
      has_evolutions: "already has evolutions: it cannot become an evolution itself"
      already_evolves: "is already the evolution of another idea"
      is_service: "is a service account: it never opens the pages, so it cannot receive a list"
      greater_than_or_equal_to_slow: "must be lower than the threshold above which an operation counts as slow"
      not_in_project: "are not among the project's platforms"
      too_large: "are too large (max 10 MB, video 20 MB)"
      invalid_type: "have an unsupported type"
      monitor_exists: "already has a monitor for this project"
      too_short: "must be at least three characters: a shorter fragment would hide real services too"
      too_long: "cannot be longer than %{count} characters each"
      uptime_unsupported: "needs a web/server platform to be monitored for uptime"
      not_epic: "must be an epic"
      self_reference: "cannot be the ticket itself"
      epic_cannot_be_nested: "does not apply to an epic: an epic cannot sit under another epic"
      epic_has_children: "cannot change while the epic has child tickets: detach them first"
      keyword_needs_body: "is not available with the HEAD method (no body)"
      webhook_url_invalid: "must have a valid public http(s) URL"
      cross_tenant: "belongs to another organization"
      host_already_linked: "is already linked to this environment"
      revoked_host: "is revoked and cannot be linked"
      servers_disabled: "Servers are disabled for this environment on this project"
      uptime_disabled: "Uptime is disabled for this environment on this project"
      secrets_disabled: "Secrets are disabled for this environment on this project"
      shared_secret_conflict: "is already delegated to this project by an organization secret"
      local_secret_conflict: "the project already has its own secret with this name in this environment"
      delegation_conflict: "the project already receives another organization secret with this name in this environment"
      length_budget_exceeded: "is over the %{count} character limit (currently %{actual}): shorten it or split it up"
  pagination:
    per_page: "rows:"
    info: "%{from}–%{to} of %{total}"
    previous: "Previous"
    next: "Next"
