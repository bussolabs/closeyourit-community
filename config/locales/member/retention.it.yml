      # uguali per tutti, ora si decidono qui progetto per progetto.
      thresholds_section: Quando un'operazione è lenta
      performance_fast_ms_label: Sotto quanti millisecondi è veloce (verde)
      performance_fast_ms_placeholder: "predefinito: 150"
      performance_fast_ms_hint: Sotto questo tempo l'operazione si mostra in verde. Lascia vuoto per usare il valore predefinito.
      performance_slow_ms_label: Da quanti millisecondi è lenta (rosso)
      performance_slow_ms_placeholder: "predefinito: 500"
      performance_slow_ms_hint: Da questo tempo in su l'operazione si mostra in rosso; nel mezzo è ambra. Lascia vuoto per usare il valore predefinito.
      thresholds_effective: "In vigore: verde sotto %{fast}, ambra fino a %{slow}, rosso oltre"
      ingest_section: Ingest pubblico
      allowed_origins_label: Origini consentite (allowlist)
      allowed_origins_placeholder: "https://www.tuosito.it"
      allowed_origins_hint: Una origine per riga. Se compilata, i dati inviati dal browser sono accettati solo da questi siti; lascia vuoto per non porre vincoli. Non protegge i client non browser.
      features_section: Funzionalità
      quick_bug_report_enabled_label: Segnalazione rapida di un problema
      quick_bug_report_enabled_hint: Mostra l'assistente AI che trasforma testo libero in una segnalazione strutturata.
      helpdesk_enabled_label: Ricevi le richieste di assistenza dai siti
      helpdesk_enabled_hint: Chi visita i siti di questo progetto può scrivere al team. Le richieste arrivano in Assistenza.
      analytics_enabled_label: Raccogli le statistiche del sito
      analytics_enabled_hint: Raccoglie i pageview di questo progetto e li mostra in Statistiche del sito. Richiede una piattaforma web.
      session_replay_enabled_label: Registra le sessioni
      session_replay_enabled_hint: Registra la navigazione di chi usa questo sito e la rende riguardabile in Session replay. I valori delicati restano nascosti e le registrazioni si cancellano da sole alla scadenza.
      secret_approval_enabled_label: Approvazione in due per i secret
      secret_approval_enabled_hint: Attiva la richiesta di conferma da un secondo responsabile per le modifiche ai secret negli ambienti protetti.
      supporter_section: Supporter
      supporter_hint: Il supporter risponde alle domande delle macchine e approva i piani fino a rischio 6 su 10. Ogni sua decisione resta nel ticket.
      supporter_enabled_label: Supporter attivo
      supporter_enabled_hint: Spento, tutte le domande e i piani arrivano a una persona, come oggi.
      supporter_reserved_topics_label: Temi riservati del progetto
      supporter_reserved_topics_placeholder: "mailchimp\napp/services/payments/"
      supporter_reserved_topics_hint: Uno per riga. Si sommano a quelli dell'organizzazione e ai temi fissi, senza toglierli. Una riga con la barra (/) indica una cartella del codice.
      tickets_section: Ticket
      default_assignee_label: Assegnatario di default
      default_assignee_placeholder: Nessuno
      default_assignee_hint: I nuovi ticket di questo progetto senza assegnatario esplicito vengono assegnati a questa persona.
      # CYRA-883 — the CTO field was written in Italian only.
      cto_label: CTO del progetto
      cto_none: Nessun CTO configurato
      cto_inherit: "Eredita %{name}"
      cto_hint: Se vuoto usa il CTO dell'organizzazione. Quello del progetto ha la precedenza.
