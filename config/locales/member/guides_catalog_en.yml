# CYRA-336 — una riga per ogni voce di menu: il catalogo delle guide copriva un terzo delle
# destinazioni, e chi arrivava non aveva modo di sapere cosa fanno le altre.
en:
  member:
    guides:
      nav:
        sections:
          start: "Start here"
          product: "Product and knowledge"
          observability: "Observability"
          security: "Security and SEO"
          infrastructure: "Infrastructure"
          vault: "Vault"
          organization: "Automation and organization"
      catalog_title: "Everything there is"
      catalog_intro: "One line for every page of the product, area by area. Where a guide exists, the link opens it."
      catalog_open: "Guide"
      catalog:
        activity: "Who did what and when: work, tickets, permissions and Vault in a single list."
        agents: "The machines working tickets for you: which ones, what they are doing, whether they stopped."
        alert_channels: "Webhook destinations for alerts. Personal email and Telegram delivery are configured in Preferences."
        alert_notifications: "The warnings you already received, all in one place: system failures, ticket news, messages from the machines working for you."
        alerts: "The rules that decide when the system should warn you, and whom to warn."
        analytics: "How many people visit your site, where they come from and which pages they read."
        book: "Collections that put several knowledge pages in order, like a manual."
        crons: "The jobs that must run on their own at a set time: here you see whether they actually ran."
        databases: "The state of your machines' databases: space, connections, copies."
        datasets: "A choice you always make the same way: show it the cases you decided, then ask it instead."
        environments: "Project environments — development, staging, production — and what they are called."
        errors: "The errors your applications report, grouped by problem instead of one by one."
        feature_matrix: "What each product does, feature by feature, and how far along it is."
        # CYRA-545 — the GitHub App row became the row of every integration: in the menu the entry is
        # the list of services, and GitHub is one of its cards.
        integrations: "The external services this organization uses with its own keys: which ones exist, which you connected, and what stops working if you remove one."
        guidance: "The instructions the project gives assistants when they work for you."
        organization_ai: "How your organization uses AI: the platform models, a variation or your own provider."
        helpdesk: "The requests written by the visitors of your projects' sites: you read them and discard the useless ones."
        ideas: "The team's proposals before they become work: you vote and choose."
        knowledge: "What the team knows and shouldn't rediscover every time, written and searchable."
        knowledge_overview: "The starting point of knowledge: what exists, what is waiting for review."
        knowledge_review: "Pages proposed by an assistant, waiting for your yes."
        logs: "The diary of what applications write while they work."
        members: "The people in the organisation and what each of them can do."
        my_work: "What concerns you: assigned, waiting for your move, overdue."
        org_files: "The organisation's confidential files — certificates, keys — safe and shared."
        org_variables: "The confidential values that apply to the whole organisation."
        organization: "Your organisation's details and the settings that apply to everyone."
        performance: "What slows your applications down: the slow requests, lined up."
        personal_files: "Your confidential files, which nobody else sees."
        personal_variables: "Your confidential values, which nobody else sees."
        platforms: "The product kinds of your projects — site, app, service — and what they imply."
        projects: "The organisation's projects: what they contain and who works on them."
        replays: "Recordings of what a person did on the site before a problem."
        roles: "Roles and permissions: who can see and who can change."
        servers: "The machines that keep your services up: memory, disk, running programs."
        service_accounts: "The accounts programs use instead of a person."
        status_page: "The public page that tells your users whether the service works."
        teams: "Groups of people you assign work and permissions to together."
        tickets: "The work to do, one per line: what, for whom, how far along."
        uptime: "The checks that continuously verify whether your sites respond."
        vault_attention: "Everything about confidential values that needs a move: missing, overdue, waiting for a yes."
        vault_audit: "Who read or changed a confidential value, and when."
        vault_capabilities: "What the vault can do, in plain words, and where to start from."
        vault_organization: "Your organization's confidential values, text and files, to lend to projects."
        vault_personal: "Your own confidential values, text and files, that nobody else can see."
        vault_projects: "Each project's confidential values, environment by environment, or searched by name."
        vulnerabilities: "Known holes in the programs you use, and which to close first."
        seo_sites: "The sites the system visits on its own, how often it checks them and how the last run went."
        seo_issues: "The problems found on the pages, worst first, with the evidence of what was there and what should have been."
        seo_pages: "Every page seen by the last check, with what each one declares about itself."
        clusters: "The machines and applications in a cluster, their health and their last update."
        workload: "Activities assigned to a team, with participants, progress and due dates."
