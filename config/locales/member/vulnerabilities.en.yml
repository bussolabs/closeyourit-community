      vulnerabilities:
        title: Vulnerabilities
        subtitle: How CloseYourIt finds security problems in the libraries you use.
        what_title: What it checks
        what_intro: Every night CloseYourIt reads the list of libraries in each project connected to a repository and compares it with the public database of known security problems.
        what_libraries: Libraries for Ruby, JavaScript, Flutter and Go, including the ones pulled in by other libraries.
        what_runtimes: Language versions that no longer receive security fixes, or that are about to stop.
        what_alerts: An alert when something new shows up, and an automatic ticket for the serious ones.
        setup_title: How to turn it on
        step_connect_title: Connect the repository to the project
        step_connect_body: The check works on projects that have a connected repository. Nothing to install in your code.
        step_wait_title: Wait for the first check
        step_wait_body: The first list appears after the nightly check. If you don't want to wait, you can ask for one right away from the page.
        step_triage_title: Decide what to do
        step_triage_body: For each entry you see the version to update to, when there is one. You can open a ticket or set aside the ones you have already assessed.
        severity_title: Severity and tickets
        severity_intro: "Severity comes from the public database and ranges from low to critical. Some entries are unclassified: nobody has assessed their weight yet."
        severity_ticket: The automatic ticket only fires for high and critical vulnerabilities. The others stay in the list, and you open the ticket when you decide to act.
        severity_ignore: "If you choose to live with a risk, mark it as ignored: it will not come back at the next check."
