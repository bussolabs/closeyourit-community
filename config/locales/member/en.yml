    guides:
      back: Guides
      index:
        title: Guides
        help_title: "How to connect your apps and use each feature."
        intro: Connect your apps to CloseYourIt and get the most out of monitoring. Each guide explains what the feature does and the exact steps to wire it up.
        errors:
          title: Errors
        uptime:
          title: Uptime
        performance:
          title: Performance
        replays:
          title: Session replay
      errors:
        title: Errors
        subtitle: Collect the errors from your applications, whatever language they are written in.
        what_title: What it is
        what_intro: CloseYourIt captures exceptions from your app and groups them into deduplicated issues. Every occurrence rolls up into one issue by fingerprint, so a thousand identical crashes stay one row with counters — not noise.
        what_levels: Levels — debug, info, warning, error, fatal.
        what_status: Status — unresolved, resolved, ignored. A resolved issue that recurs reopens automatically.
        what_promote: Promote to ticket — turn any issue into a bug ticket in one click.
        connect_title: Connect your app
        connect_step1: Open your project, create a token in Settings, «Ingest tokens» section, and copy the secret and Project ID — the kit needs both.
        connect_step3: "Trigger an error. It shows up under %{space} › %{page} within seconds."
        sdk:
          ruby:
            label: Ruby
            step2: "Add the gem and configure it with the token and Project ID:"
            published: "Published on RubyGems as closeyourit-ruby, version 0.8.0."
          js:
            label: JavaScript
            step2: "Install the package and initialise it as early as possible at start-up:"
            published: "Published on npm as @bussolabs/closeyourit-js, version 0.8.0."
          dart:
            label: Flutter / Dart
            step2: "Add the package and initialise it before running the app:"
            published: "Published on pub.dev as closeyourit, version 0.7.0."
        sourcemaps_title: Readable browser errors
        sourcemaps_intro: "Code running in a browser is minified: file and function names become short tokens, and a stack reads like “locale-redirect-yIZlgYBo.mjs”. The error is real and grouping still works, but tracing it back takes a couple of habits."
        sourcemaps_release: "Always set the release when you initialise the kit: knowing which build an error came from is half the work."
        sourcemaps_keep: "Keep each build's source maps in a private archive. Upload them with the CLI, matching the project, release and generated filename recorded in the error."
        sourcemaps_limit: "Use cyi artifacts source-maps upload --help for upload options. The error detail lets you compare received and reconstructed stacks; unresolved frames remain identified, without changing the original event."
        replays_title: Watching what happened
        replays_intro: Replays show what a person did on the site before an error. They are off by default and are switched on per project.
        replays_step1: Open the project and go to its settings.
        replays_step2: "Turn replays on: the option shows up on projects that have a web platform."
        replays_step3: "Put the code that asks for recording into your site: the switch alone is not enough, and without the code no session ever arrives."
        replays_step4: From an error page you can open the recording of the session it happened in, when there is one.
        replays_note: "Recordings are heavy to store: turn them on where they earn their keep, not everywhere."
        replays_guide: Go to the recordings guide
        affected_title: Who's affected
        affected_intro: "The “Users” column counts the distinct people who hit an error. While it reads “not tracked”, no event carries the identity of whoever hit it: it isn't zero, it simply never arrived."
        affected_how: "Tell the SDK who the user is before the error is captured. The user id is enough — a stable identifier; email or IP aren't needed and are only sent if you explicitly turn on sending personal data:"
        affected_count: From then on every error knows who it hit and the “Users” column shows distinct people — so you can sort by real severity, not by noise.
        affected_privacy: "The count uses an anonymous fingerprint; email, IP and username are never stored. The id you choose stays visible on the occurrence: use one that doesn't reveal personal data."
        privacy_title: Hidden values (privacy)
        privacy_intro: Some values (passwords, tokens, emails and the like) are scrubbed before they're stored and show up as “Hidden” on the error page. It's a privacy choice, not a failure — the sensitive value is never kept.
        privacy_hidden: Where you see “Hidden”, the value was removed on purpose by a privacy rule.
        privacy_paths: "File paths (the code location) are not scrubbed by CloseYourIt: if you see them hidden, it's your SDK's scrubber configured too aggressively."
        privacy_where: "What gets hidden is decided in your project's SDK configuration (the data scrubber / before_send): that's where you widen or narrow the rules."
        triage_title: What to do with an error
        triage_resolve: Resolve
        triage_resolve_desc: Mark fixed. Reopens if it recurs.
        triage_ignore: Ignore
        triage_ignore_desc: Mute noisy issues you don't care about.
        triage_reopen: Reopen
        triage_reopen_desc: Bring a muted issue back to active.
        triage_promote: Promote
        triage_promote_desc: Create a bug ticket from the issue.
        triage_note: "Triaging and turning into a ticket are two permissions of your role: «%{triage}» and «%{promote}»."
        cta: Go to Errors
      uptime:
        title: Uptime
        subtitle: Checks that your sites answer, and keeps count of when they didn't.
        what_title: What it is
        what_intro: A monitor opens an address of your site at regular intervals and records every check. There is one for each environment of the project, so the live site and the test one are followed separately.
        what_checks: Checks — at every round, whether the site answered and how fast.
        what_incidents: Incidents — one opens by itself when checks fail in a row (two, unless you choose otherwise) and closes as soon as the site answers again.
        what_sla: Availability — the share of time the site answered, over the last 24 hours, 7 days, 30 days and a year, with a strip of coloured blocks.
        setup_title: Set up a monitor
        setup_step1: Declare the environment on your project (e.g. production) — a monitor can only target a declared environment.
        setup_step2: "From %{space} › %{page}, click New monitor and fill the fields:"
        setup_step3: Pause or resume a monitor anytime — paused monitors keep their history but stop checking.
        field_type: What to check
        field_type_desc: a website, a port on a server, a domain name (DNS) or whether a machine answers (ping)
        field_url: URL
        field_url_desc: the endpoint to ping (https only, public)
        field_environment: Environment
        field_environment_desc: one declared environment of the project
        field_method: Method
        field_method_desc: GET / HEAD
        field_status: Expected status
        field_status_desc: e.g. 200
        field_interval: Interval
        field_interval_desc: how often to check (seconds)
        field_timeout: Timeout
        field_timeout_desc: when to consider a check failed
        field_latency: Slow response
        field_latency_desc: above how many milliseconds we warn you it is slow, even when it answers (blank = no
          warning)
        name_note: The monitor name is derived automatically as Project · Environment.
        embed_title: Show the status on your own site
        embed_step1: Publish the status page of the monitor (or the group) with the Publish button. Until it is published there is nothing to show outside.
        embed_step2: "Press Embed: a window opens with two ready-made pieces of code."
        embed_badge: Badge
        embed_badge_desc: a small strip with the current status, for your site footer
        embed_page: Full page
        embed_page_desc: the whole status page inside one of your own pages
        embed_step3: Copy the code and paste it into your site wherever you want it. It refreshes itself on every load.
        embed_note: If you unpublish, code already pasted stops showing anything. The code comes out in the language you are using.
        alert_title: Get alerted when it goes down
        alert_intro: "A monitor records outages, but it doesn't alert anyone on its own: the last step is saying who gets alerted if the site goes down."
        alert_step1: "Open %{page} and create a new rule."
        alert_step2: Pick the "Site unreachable" event — leave the project empty to cover them all, or choose one.
        alert_step3: Link the channels (email, Telegram, webhook) where you want to receive the alert.
        alert_cta: Go to Alert rules
        cta: Go to Uptime
      # CYRA-376 — session recording was explained nowhere: not what it captures, not how to turn it
      # on, not what never makes it into the recording.
      replays:
        title: Session replay
        subtitle: A recording of what a person did on your site, to watch back like a video.
        what_title: What it is
        what_intro: "Session replay records how people browse your site and gives it back to you as a video. It is what you need when a report cannot be reproduced: instead of rebuilding the steps from words, you watch them."
        what_watch: Watch the session — the pages opened one after another, with the duration and when it started.
        what_errors: Errors in the session — if something broke while browsing, you go from the recording to the error and back.
        what_filters: Find the right session — filter by project, environment, entry page, or only the ones where something went wrong.
        setup_title: How to turn it on
        setup_intro: "Recording does not start by itself, and the switch alone is not enough: two things are needed together, the switch on the project and the code in your site's pages. With only one of them no session ever arrives, and nobody tells you."
        setup_step1: Pick the project whose sessions you want to record. Only projects with the Web platform appear here, because that is where sessions are recorded.
        setup_step2: "In its settings flip the «Record sessions» switch: it opens the way to recordings coming from that project."
        setup_step3: Copy this code and paste it into your site's pages, inside the header. It is already filled in for the project you picked.
        setup_step4: Sessions show up as people browse. From then on the recordings page lists them, newest first.
        setup_cta: "%{project} settings"
        setup_locked: You cannot change this project's settings. Ask whoever manages it to flip the switch.
        apply: Apply
        pick_project: Choose a project
        copy: Copy
        copied: Copied
        project_placeholder: YOUR_PROJECT
        no_project: "None of the projects you can see has the Web platform: sessions are only recorded there. The code below still holds, with your own values in place of the placeholders."
        no_project_link: Go to projects
        token_where: The key in the code is the one for the project you picked.
        token_link: Manage the project keys
        token_locked: "You get a placeholder instead of the real key: the key is visible to whoever manages that project's keys. Ask them for it and swap it in before you publish."
        token_missing: "This project has no active key yet, so the box shows a placeholder: create one and put it in its place."
        snippet_note: "The first line loads the part that actually records the browsing: without it everything else keeps working and the recordings do not, silently. Keep it before the others."
        errors_title: From the error to the recording
        errors_intro: On an error page, below the occurrence details, there is the panel of the session recorded when the error happened. From there you watch what the person was doing in the moments before the failure, without hunting for the session by hand.
        errors_none: "When there is no recording for that error, the panel stays and says so. It is not a fault: either recording was off, or the error does not come from browsing the site."
        errors_cta: Go to Errors
        privacy_title: What never makes it into the recording
        privacy_intro: "A recording is sensitive data: the product treats it as such, and the choices are already made on the cautious side."
        privacy_masked: Sensitive values (passwords, payment data, fields marked as private) are masked by the kit on your site, before they leave. They arrive here already hidden and are never inspected.
        privacy_user: Of the person browsing only an anonymous fingerprint is kept, not their name or email. It tells you two sessions belong to the same person, not who they are.
        privacy_retention: Recordings are kept for 30 days, or as many as you set on the project. After that they are really deleted, videos included.
        cta: Go to Session replay
      performance:
        title: Performance
        subtitle: Slow queries and slow methods, from your app.
        what_title: What it is
        what_intro: "Performance tracks the slow spots in your app and groups them the same way as errors: by fingerprint, into deduplicated groups with duration aggregates."
        what_query: slow_query — grouped by the templated SQL signature.
        what_method: slow_method — grouped by the method label.
        what_aggregates: Aggregates — sample count and min / max / avg / total duration per group.
        connect_title: Connect with the gem
        connect_step1: Issue a bearer ingest token from your project, in Settings, «Ingest tokens» section. It's shown once — store it as a secret.
        connect_step2: "Add the gem and configure it with the token and Project ID:"
        connect_step3: The gem sends samples fire-and-forget, with PII scrubbed.
        issues_title: Slowdowns found on their own
        issues_intro: "Besides the slow queries and methods you measure yourself, monitoring recognises a few typical situations while your app works. They are a third of what you see in the list, and they carry the least obvious names: here is what each one means."
        issues_note: "The first four come from server applications, the last three from mobile apps: you only see the ones your programs can send."
        trend_title: Telling whether something is getting worse
        trend_chart: "Open a slowdown and the first chart is \"Duration over time\": each bar is how long the operation took in that slice of time, and the height is the worst case. The chart below counts how many times it happened instead: two different charts, because something can keep happening just as often while taking twice as long."
        trend_compare: "Above the chart you get the average for the period you picked and how much it changed against the previous period of the same length: the last 24 hours against the 24 before. When there was nothing to compare with, it says so instead of showing a made-up change."
        trend_thresholds: "Times are coloured: green when the operation is fast, amber in between, red when it is slow. Hover a time to read the two thresholds that decided that colour, and from the detail you reach the project settings to change them. Every project has its own: for an internal operation \"slow\" can mean something different than for a public page."
        trend_note: "With no thresholds of your own the defaults apply: fast below %{fast}ms, slow from %{slow}ms up. The duration chart shows the cases still kept, so it looks back as far as the project keeps them."
        cta: Go to Performance
