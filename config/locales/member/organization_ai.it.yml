        options:
          platform: Usa la piattaforma
          variation: Variazione
          own: Provider proprio
        descriptions:
          platform: Modelli, chiavi e tetto sono quelli della piattaforma.
          variation: Stesso provider e stessa chiave della piattaforma, con i modelli e il tetto che scegli qui.
          own: Tutte le richieste vanno al tuo provider compatibile OpenAI, con la tua chiave.
      models:
        title: Modelli
        hint: Un campo vuoto usa il valore della piattaforma. Con un provider proprio, un campo vuoto spegne quella funzione.
