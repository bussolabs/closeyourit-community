        embedding_model: Modello di ricerca
        embedding_model_hint: Deve avere la stessa misura della piattaforma. Cambiarlo ricalcola i dati di questa organizzazione.
        transcription_model: Modello di dettatura
        transcription_model_hint: Trasforma la voce in testo.
        rerank_model: Modello di riordino
