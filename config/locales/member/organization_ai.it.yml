      title: AI dell'organizzazione
      test: Prova collegamento
      save: Salva
      updated: Impostazioni AI salvate.
      reindex:
        title: La ricerca va ricalcolata
        body: Con un altro modello di ricerca i dati di questa organizzazione vanno ricalcolati. Finché il ricalcolo non finisce, ricerca e suggerimenti di doppioni trovano meno risultati. Le altre organizzazioni non cambiano.
        confirm: Salva e ricalcola
      mode:
