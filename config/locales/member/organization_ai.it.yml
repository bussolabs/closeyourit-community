        base_url_hint: L'indirizzo compatibile OpenAI, per esempio https://api.openai.com/v1.
        api_key: Chiave del provider
        api_key_hint: Lascia vuoto per tenere la chiave salvata.
        rerank_base_url: Indirizzo del riordino
        rerank_base_url_hint: Solo se il riordino sta su un altro indirizzo.
        rerank_api_key: Chiave del riordino
        rerank_api_key_hint: Lascia vuoto per tenere la chiave salvata.
