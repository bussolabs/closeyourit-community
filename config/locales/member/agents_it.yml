          other: Un motore diverso da chi lavora rilegge. Deve essere anche lui sulla macchina.
          same: Lo stesso motore che lavora rilegge, in una sessione nuova. Basta un motore solo.
          opencode: OpenCode rilegge e non può scrivere. Deve essere sulla macchina, con l'accesso fatto.
