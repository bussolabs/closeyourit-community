it:
  member:
    guides:
      # CYRA-446 — la stessa riga in cima alle due guide sui segreti: il Vault e l'area, i secret
      # dell'organizzazione sono uno dei suoi tre spazi. Una fonte sola per entrambe le pagine, così
      # non possono raccontare due differenze diverse.
      secrets_split:
        title: Dove va un segreto
        intro: "Vault e Secret dell'organizzazione non sono due posti alternativi: il primo contiene il secondo."
        vault_line: "L'area che raccoglie tutti i segreti, divisi in tre spazi — i tuoi personali, quelli dell'organizzazione e quelli di un singolo progetto — e ne mostra lo stato: chi li ha toccati e quali vanno cambiati."
        secrets_line: "Uno dei tre spazi del Vault: i valori che servono su più progetti, con un valore diverso per ogni ambiente. Li deleghi ai progetti che devono usarli e li revochi quando vuoi, senza copiarli in giro."
        rule: "In pratica, prima di salvare chiediti a chi serve il valore: se serve solo a te va nei segreti personali; se serve a un progetto solo, nei segreti di quel progetto; se serve a più progetti, nei secret dell'organizzazione, delegato ai progetti giusti. Nel posto sbagliato lo legge chi non doveva vederlo."
        open_vault: Apri la guida del Vault
        open_secrets: Apri la guida dei secret dell'organizzazione
