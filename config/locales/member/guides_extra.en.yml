      crons:
        title: "Scheduled jobs"
        subtitle: "Notice when a job that should run on its own stops running."
        what_title: "What they are"
        what_intro: "A scheduled job is something that runs on its own at intervals: a nightly backup, an email send, a clean-up. You do not start it here: you get told when it does NOT start."
        what_b1: "The job says “I ran” every round, and if it stops saying so someone notices."
        what_b2: "You declare how often it should run and how much delay is acceptable."
        what_b3: "If it ran but went wrong, it can also say why."
        words_title: "Two words that look alike"
        setup_title: "How to start"
        setup_intro: "There is nothing to create here: the job shows up the first time it checks in. The instructions with the address and a ready command live on their own page."
        cta: "Open scheduled jobs"
      logs:
        title: "Logs"
        subtitle: "Collect your apps' messages in one place and search them when you need to."
        what_title: "What logs are"
        what_intro: "Logs are the messages your apps write while they run: information, warnings and errors. Here you gather them all together and check them when something doesn't add up."
        what_b1: "A single stream with the messages from all your apps."
        what_b2: "Filters by level, environment, project and text to find what you need at once."
        what_b3: "When a request has an identifier, its messages link themselves to the errors and other messages of the same request."
        setup_title: "Getting started"
        setup_step1: "Create a project and open it to get its connection code."
        setup_step2: "Add the package to your app and configure it with the connection code and Project ID:"
        setup_step3: "From then on messages arrive on their own. They are sent to"
        cta: "Open logs"
      servers:
        title: "Server monitoring"
        subtitle: "Keep an eye on your servers from a single page."
        what_title: "What server monitoring is"
        what_intro: "It shows the health of your servers — how busy they are, whether they have space and whether services are running — so you notice before it becomes a problem."
        what_b1: "The status of all your servers at a glance."
        what_b2: "History of CPU, memory, disk and temperature."
        what_b3: "Alerts when a server stops responding or a service goes down."
        setup_title: "Getting started"
        setup_step1: "Open the Servers page and create a code for the agent."
        setup_step2: "Install the agent on the server using the instructions shown to you."
        setup_step3: "Within a minute the server appears on the page with its data."
        cta: "Open servers"
      analytics:
        title: "Site analytics"
        subtitle: "Find out how many people visit your site and where they come from."
        what_title: "What analytics are"
        what_intro: "They tell you how many visits and visitors your site has, which pages are most viewed and where traffic comes from — respecting privacy, without cookies."
        what_b1: "Visits and visitors in real time."
        what_b2: "Most viewed pages and traffic sources."
        what_b3: "No cookies and no personal data collected."
        setup_title: "Getting started"
        setup_step1: "Pick the project whose site you want to measure. Only projects with the Web platform and analytics collection switched on appear here."
        setup_step2: "Copy this code and paste it into your site's pages, inside the header. It is already filled in for the project you picked."
        setup_step3: "Open the project analytics: the first visit shows up within seconds."
        apply: "Apply"
        pick_project: "Choose a project"
        copy: "Copy"
        copied: "Copied"
        project_placeholder: "YOUR_PROJECT"
        no_project: "There is no project to measure yet: you need a project with the Web platform and analytics collection switched on. The code below still holds, with your own values in place of the placeholders."
        no_project_link: "Go to projects"
        token_where: "The key in the code is the one for the project you picked."
        token_link: "Manage the project keys"
        token_locked: "You get a placeholder instead of the real key: the key is visible to whoever manages that project's keys. Ask them for it and swap it in before you publish."
        cta: "Open the analytics"
        cta_no_project: "Choose a project"
      secrets:
        title: "Organization secrets"
        subtitle: "Store sensitive information and delegate it to the right projects."
        what_title: "What organization secrets are"
        what_intro: "They are the organization's sensitive variables — keys, passwords, tokens — stored securely and available to the projects you delegate them to, without copying them around."
        what_b1: "Values encrypted and always shown masked."
        what_b2: "A different value for each environment (production, staging…)."
        what_b3: "A history of changes with the option to restore."
        what_b4: "Visible only to the projects you delegate them to, not to the whole team."
        setup_title: "Getting started"
        setup_step1: "Open organization secrets and add a variable with its name."
        setup_step2: "Enter the value for each environment where it's needed."
        setup_step3: "Delegate the variable to the projects that should use it and revoke it whenever you want; then read it from your application with the ready-made command at the bottom of the page — on your computer, in automated builds or on the server."
        cta: "Open organization secrets"
      knowledge:
        title: "Knowledge base"
        subtitle: "Collect project notes, decisions and guides in searchable pages."
        what_title: "What the knowledge base is"
        what_intro: "It's the space where the team writes and finds project information: notes, decisions made and guides, all searchable by meaning too."
        what_b1: "Pages per project: notes, decisions and guides."
        what_b2: "Search that understands meaning, not just exact words."
        what_b3: "Suggestions of related pages on tickets and errors."
        setup_title: "Getting started"
        setup_step1: "Open the project's Knowledge base."
        setup_step2: "Create a page choosing whether it's a note, a decision or a guide."
        setup_step3: "Write the content and save: it will be searchable by the team right away."
        links_title: "Linking pages together"
        links_intro: "While writing you can point to another page by putting its title between double square brackets. On save it turns into a clickable link."
        links_example: "Example: write [[Kamal deploy]] and readers reach that page with one click."
        links_b1: "Every page shows what it links to and who links to it."
        links_b2: "If you rename the target page, the link keeps working."
        links_b3: "If the title doesn't exist yet, it stays plain text: no broken links."
        books_title: "Books"
        books_intro: "A book lines up several pages in the order you choose: the index on the left, the open page on the right. Use it when pages are meant to be read one after the other, like a manual or a path for newcomers."
        books_b1: "The order in which you pick the pages is the order readers see."
        books_b2: "One book can hold pages from different projects."
        books_b3: "A page belongs to one book only: it is never copied around."
        reread_title: "When a page has to be reread"
        reread_intro: "A decision or a guide does not stay true forever: the system it describes can change or be dismissed. Every page of these two kinds gets a date by which it should be looked at again — six months for a decision, one year for a guide. Notes never expire."
        reread_b1: "Past that date the page can still be found: it shows up marked as to review, it does not disappear."
        reread_b2: "Pages to reread are collected in the Review page, where you confirm they are still true."
        reread_b3: "If you fix it instead, the date restarts on its own: there is nothing to confirm."
        cta: "Open the knowledge base"
      tickets:
        title: "Ticket kinds"
        subtitle: "Bug, story, task and epic: which one to pick and how to group larger work."
        what_title: "The four kinds"
        what_intro: "Every ticket has a kind. It tells you at a glance what sort of work it is and it drives the filters. You pick it when you open the ticket and you can change it later."
        what_b1: "Something doesn't work the way it should."
        what_b2: "New or improved value for whoever uses the product."
        what_b3: "Technical work the people using the product never see."
        what_b4: "A large goal that collects other tickets."
        setup_title: "Using epics"
        setup_step1: "Open a ticket and pick Epic as its kind: that's the container."
        setup_step2: "Open the tickets for the actual work and, in the Epic field, pick the epic you just created. It must be in the same project."
        setup_step3: "The epic's page lists the tickets it contains and how many are already closed."
        rules_title: "What you cannot do"
        rules_b1: "An epic cannot sit inside another epic: there is only one level."
        rules_b2: "A ticket can only sit under an epic of its own project."
        rules_b3: "While an epic contains tickets you cannot change its kind: detach the children first."
        rules_b4: "Deleting an epic keeps its tickets: they only lose the link."
        cta: "Open tickets"
