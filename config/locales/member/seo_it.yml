        inp: Quanto tarda la pagina a reagire quando ci tocchi sopra.
        cls: Quanto la pagina si sposta sotto gli occhi mentre carica.
        ttfb: Quanto ci mette il server a mandare la prima risposta.
        fcp: Quanto ci mette a comparire qualcosa, qualunque cosa.
