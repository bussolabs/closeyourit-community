  seo:
    vitals:
      lab: Laboratorio
      field: Campo
      lab_explainer: "Un giro di prova su una macchina di Google, con una rete simulata: dice PERCHÉ il sito è lento, e si può ripetere uguale. Non è quello che hanno vissuto i tuoi visitatori."
      field_explainer: "Quello che è successo davvero a chi ha aperto il sito: dice QUANTO è lento per le persone. È il numero che Google guarda per il posizionamento, e non sa dire perché."
      percentile: "Su tre visite su quattro il sito ha fatto almeno così bene. Si guarda questo e non la media perché una media nasconde proprio le visite andate male."
      metrics:
        lcp: Comparsa del contenuto
        inp: Risposta al tocco
        cls: Salti della pagina
        ttfb: Attesa del server
        fcp: Primo segno di vita
