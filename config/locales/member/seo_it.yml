    checks:
      noindex:
        label: La pagina dice di non essere indicizzata
        explanation: Nel codice della pagina c'è l'istruzione «noindex», che chiede ai motori di ricerca di non mostrarla. Se la pagina deve essere trovata, va tolta.
        expected: La pagina non contiene più l'istruzione noindex.
      blocked_by_robots:
        label: Pagina vietata dal robots.txt ma dichiarata nella sitemap
        explanation: Il sito chiede di indicizzare questa pagina nella sitemap e allo stesso tempo ne vieta la lettura nel robots.txt. Le due istruzioni si contraddicono, e vince quella che la esclude.
        expected: "La pagina è coerente: o esce dalla sitemap, o non è più vietata dal robots.txt."
      broken_link:
        label: La pagina non risponde
        explanation: All'indirizzo non c'è più niente, o il server dà errore. Chi ci arriva da un link o dai risultati di ricerca trova una porta chiusa.
        expected: L'indirizzo risponde di nuovo, oppure viene reindirizzato dove il contenuto si è spostato.
      redirect_loop:
        label: Rimbalzo infinito
        explanation: L'indirizzo rimanda a un altro che rimanda indietro, all'infinito. Nessuno arriva alla pagina, nemmeno i motori di ricerca.
        expected: L'indirizzo porta a una pagina, senza girare in tondo.
      redirect_chain:
        label: Troppi rimbalzi prima di arrivare
        explanation: Per arrivare alla pagina si passa da più indirizzi intermedi. Ogni salto costa tempo e disperde il valore dei link.
        expected: L'indirizzo porta alla pagina finale con un salto solo.
      canonical_missing:
        label: Manca l'indirizzo ufficiale della pagina
        explanation: Il canonical dice ai motori qual è l'indirizzo buono quando lo stesso contenuto è raggiungibile da più strade. Senza, decidono loro.
        expected: La pagina dichiara il proprio indirizzo ufficiale.
      canonical_points_elsewhere:
        label: L'indirizzo ufficiale porta a un'altra pagina
        explanation: La pagina è nella sitemap, quindi il sito la vuole nei risultati, ma dichiara come ufficiale un altro indirizzo. Così sparisce dai risultati.
        expected: La pagina dichiara sé stessa come indirizzo ufficiale, oppure esce dalla sitemap.
      sitemap_unreachable:
        label: La sitemap non risponde
        explanation: La sitemap è l'elenco delle pagine che il sito vuole far trovare. Se non risponde, i motori devono indovinare cosa esiste.
        expected: La sitemap risponde e contiene le pagine del sito.
      robots_unreachable:
        label: Il robots.txt non risponde
        explanation: È il file che dice ai motori dove possono andare. Senza, ogni crawler decide da sé.
        expected: Il file robots.txt risponde.
      missing_from_sitemap:
        label: Pagina fuori dalla sitemap
        explanation: La pagina si raggiunge navigando, ma non è nell'elenco che il sito dichiara. Viene trovata più tardi e considerata meno importante.
        expected: La pagina compare nella sitemap.
      orphan_page:
        label: Pagina che nessuno collega
        explanation: La pagina è nella sitemap ma nessun'altra pagina del sito la linka. Chi naviga non ci arriva mai, e per i motori vale quanto i link che riceve, cioè niente.
        expected: Almeno una pagina del sito porta a questa.
      missing_title:
        label: Manca il titolo
        explanation: Il titolo è la riga che compare nei risultati di ricerca. Senza, il motore se lo inventa dal contenuto.
        expected: La pagina ha un titolo che dice di cosa parla.
      title_too_long:
        label: Titolo troppo lungo
        explanation: Oltre una certa lunghezza il titolo viene tagliato nei risultati, e la parte importante può finire fuori.
        expected: Il titolo sta nella lunghezza mostrata dai motori.
      duplicate_title:
        label: Titoli uguali su più pagine
        explanation: Due o più pagine si presentano con lo stesso titolo. Chi legge i risultati non capisce quale aprire, e i motori le trattano come una copia dell'altra.
        expected: Ogni pagina ha il suo titolo.
      missing_meta_description:
        label: Manca la descrizione
        explanation: È il testo sotto il titolo nei risultati di ricerca. Senza, il motore prende un pezzo qualsiasi della pagina.
        expected: La pagina ha una descrizione scritta apposta.
      duplicate_meta_description:
        label: Descrizioni uguali su più pagine
        explanation: "Più pagine mostrano lo stesso testo nei risultati: non aiuta a scegliere quale aprire."
        expected: Ogni pagina ha la sua descrizione.
      missing_h1:
        label: Manca il titolo principale nella pagina
        explanation: "L'H1 è il titolo grande in cima al contenuto. Dice a chi legge e al motore di cosa parla la pagina. Un punteggio verde non se ne accorge: non è uno dei controlli che fa."
        expected: La pagina ha un titolo principale.
      multiple_h1:
        label: Più di un titolo principale
        explanation: Con più H1 non è chiaro quale sia l'argomento della pagina.
        expected: La pagina ha un solo titolo principale.
      missing_jsonld:
        label: Manca la scheda dati della home
        explanation: I dati strutturati dicono ai motori chi sei e cosa fai, e permettono i risultati arricchiti. Sulla home valgono più che altrove.
        expected: La home dichiara i propri dati strutturati.
      lang_missing:
        label: La pagina non dichiara la lingua
        explanation: Senza la lingua dichiarata, motori e lettori di schermo devono indovinarla.
        expected: La pagina dichiara la propria lingua.
      hreflang_not_reciprocal:
        label: Le versioni in lingua non si rispondono
        explanation: Una pagina indica l'altra come sua versione in un'altra lingua, ma non riceve lo stesso rimando. I motori scartano la coppia e le due pagine restano a farsi concorrenza.
        expected: Le pagine collegate si dichiarano a vicenda.
      hreflang_missing_x_default:
        label: Manca la versione predefinita
        explanation: Serve a dire quale pagina mostrare a chi non parla nessuna delle lingue dichiarate.
        expected: Le pagine multilingua dichiarano una versione predefinita.
      thin_content:
        label: Pagina quasi vuota
        explanation: C'è troppo poco testo perché un motore capisca di cosa parla la pagina e la mostri a qualcuno.
        expected: La pagina ha contenuto sufficiente a spiegare di cosa parla.
      images_without_alt:
        label: Immagini senza descrizione
        explanation: La descrizione dell'immagine serve a chi non la vede e ai motori per capirla. Senza, l'immagine è muta.
        expected: Ogni immagine che porta significato ha la sua descrizione.
      slow_response:
        label: La pagina risponde lentamente
        explanation: Il server ci mette troppo a rispondere. Chi arriva se ne va prima di vederla.
        expected: La pagina risponde in tempi normali.
      oversized_html:
        label: Pagina troppo pesante
        explanation: Il codice della pagina è enorme. Su una connessione lenta diventa un'attesa.
        expected: La pagina ha un peso ragionevole.
      mixed_content:
        label: Risorse non protette in una pagina protetta
        explanation: La pagina è servita in sicurezza ma carica immagini o script in chiaro. Il browser li blocca o avvisa, e ciò che è bloccato per il motore non esiste.
        expected: Tutte le risorse della pagina sono servite in sicurezza.
