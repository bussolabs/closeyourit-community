      # CYRA-341 — the two thresholds that colour durations under Performance: hard-coded and the
      # same for everyone, now decided here project by project.
      thresholds_section: When an operation counts as slow
      performance_fast_ms_label: Below how many milliseconds it is fast (green)
      performance_fast_ms_placeholder: "default: 150"
      performance_fast_ms_hint: Below this time the operation shows in green. Leave blank to use the default.
      performance_slow_ms_label: From how many milliseconds it is slow (red)
      performance_slow_ms_placeholder: "default: 500"
      performance_slow_ms_hint: From this time up the operation shows in red; in between it is amber. Leave blank to use the default.
      thresholds_effective: "In force: green below %{fast}, amber up to %{slow}, red above"
      ingest_section: Public ingest
      allowed_origins_label: Allowed origins (allowlist)
      allowed_origins_placeholder: "https://www.yoursite.com"
      allowed_origins_hint: One origin per line. When set, browser data is accepted only from these sites; leave blank to allow any. It does not protect non-browser clients.
      features_section: Features
      quick_bug_report_enabled_label: Quick problem report
      quick_bug_report_enabled_hint: Shows the AI assistant that turns free text into a structured report.
      helpdesk_enabled_label: Receive help desk requests from the sites
      helpdesk_enabled_hint: Visitors of this project's sites can write to the team. Requests arrive in Help desk.
      analytics_enabled_label: Collect site analytics
      analytics_enabled_hint: Collects this project's pageviews and shows them under Site analytics. Requires a web platform.
      session_replay_enabled_label: Record sessions
      session_replay_enabled_hint: Records how people browse this site and makes it watchable under Session replay. Sensitive values stay masked and recordings are deleted when they expire.
      secret_approval_enabled_label: Two-person approval for secrets
      secret_approval_enabled_hint: Requires a second approver to confirm secret changes in protected environments.
      tickets_section: Tickets
      default_assignee_label: Default assignee
      default_assignee_placeholder: None
      default_assignee_hint: New tickets in this project with no explicit assignee are assigned to this person.
      # CYRA-883 — the CTO field was written in Italian only.
      cto_label: Project CTO
      cto_none: No CTO set
      cto_inherit: "Inherits %{name}"
      cto_hint: When empty, the organization's CTO is used. The project's own CTO takes precedence.
      # CYRA-883 — the side index and the ingest tokens section.
      nav_label: Settings sections
      retention_hint: Values for this project only. Leave a field empty to inherit the organization's.
      tokens_total: Total
      tokens_active: Active
      tokens_due_soon: Expiring soon
      tokens_expired: Expired
      tokens_revoked: Revoked
