en:
  member:
    nav:
      # CYRA-356 — the entry read «Replays» and opened a page titled «Session replay»: two names for
      # the same thing. The function name wins, the one also used in project settings and on the site.
      #
      # CYRA-584 — the canonical name is followed by the word people actually SEARCH for. «Session
      # replay» is the name the glossary wants, but it contains none of the words one has in mind
      # («recordings», «visits», «how people move»): whoever looked for it read the whole menu with
      # nothing to latch onto. The qualifier renames nothing — page title, project settings and the
      # site still say «Session replay».
      #
      # The separator is the interpunct, the one «Valhalla · God mode» already uses: the entry fits in
      # 180 px and the em dash version measures 178.5 (Inter 12.5 px), a margin the first fallback font
      # eats — truncating exactly the word people search for. See the Italian file for the numbers.
      replays: Session replay · recordings
