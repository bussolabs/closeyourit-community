      index:
        secret_overrides:
          title: Tailored values
      secret_overrides:
        title: Tailored values
        subtitle: Give one person a value different from the project's — and only to them.
        what_title: What it is
        what_intro: The passwords and addresses a project's programs read to connect to services are the same for everyone who can download them. Sometimes one person needs something different, and changing it for everybody would be wrong. A tailored value changes it for them alone.
        what_case_db: A developer working on their own copy of the database, while the rest of the team uses the shared one.
        what_case_mail: Someone testing emails who wants them in their own test inbox, not the project's.
        what_case_extra: Someone who needs an extra setting that the project doesn't have at all.
        setup_title: How to assign one
        setup_step1: Open the project, go to the passwords tab and from there to tailored values.
        setup_step2: Pick the person, the environment and the exact variable name. The person is chosen among those who can already read those passwords.
        setup_step3: Type the value and save. From then on they get it when they download the passwords to their computer, with nothing else to do.
        setup_step4: "When it's no longer needed, remove it: that person goes back to the standard value straight away."
        notes_title: Good to know
        note_only_admin: You assign it. Whoever receives it cannot change it, remove it, or assign one to themselves or anyone else.
        note_never_shown: The list shows who was given what, never the value. Only the person it is meant for reads it, when they download it.
        note_github: Only the project's standard value is ever pushed to GitHub. A tailored value never ends up in an automated pipeline, where everyone would use it.
        note_environments: "If someone cannot see an environment, a tailored value doesn't open that door: the environment limit comes first."
        note_audit: Every assignment and removal is recorded in the project's activity list, with who decided it and for whom.
