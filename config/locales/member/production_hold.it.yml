      sections:
        production: Attesa prima della produzione
      production_hold_hours_label: Ore di prova in staging prima della produzione
      production_hold_hours_placeholder:
        one: "eredita dalla piattaforma (%{count} ora)"
        other: "eredita dalla piattaforma (%{count} ore)"
        zero: "eredita dalla piattaforma (nessuna attesa)"
      production_hold_hours_hint: Vale per i progetti di questa organizzazione che non scelgono da soli. Da 0 a 72 ore intere; con 0 il rilascio non aspetta, ma un errore nuovo comparso in staging lo ferma comunque. Lascia vuoto per ereditare.
