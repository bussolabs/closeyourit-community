      vulnerabilities:
        title: Vulnerabilità
        subtitle: Come CloseYourIt scopre i problemi di sicurezza delle librerie che usi.
        what_title: Cosa controlla
        what_intro: Ogni notte CloseYourIt legge l'elenco delle librerie di ogni progetto collegato a un repository e lo confronta con l'archivio pubblico dei problemi di sicurezza noti.
        what_libraries: Le librerie di Ruby, JavaScript, Flutter e Go, comprese quelle che arrivano di rimbalzo da altre librerie.
        what_runtimes: Le versioni di linguaggio che non ricevono più correzioni di sicurezza, o che stanno per smettere.
        what_alerts: Un avviso quando salta fuori qualcosa di nuovo, e un ticket automatico per i casi gravi.
        setup_title: Come si attiva
        step_connect_title: Collega il repository al progetto
        step_connect_body: Il controllo funziona sui progetti che hanno un repository collegato. Non serve installare niente nel codice.
        step_wait_title: Aspetta il primo controllo
        step_wait_body: Il primo elenco compare dopo il controllo notturno. Se non vuoi aspettare, puoi chiederne uno subito dalla pagina.
        step_triage_title: Decidi cosa farne
        step_triage_body: Per ogni voce vedi la versione a cui aggiornare, quando c'è. Puoi aprire un ticket o mettere da parte quelle che hai già valutato.
        severity_title: Gravità e ticket
        severity_intro: "La gravità arriva dall'archivio pubblico e va da bassa a critica. Alcune voci non sono classificate: significa che nessuno ha ancora stabilito quanto pesano."
        severity_ticket: Il ticket automatico scatta solo per le vulnerabilità alte e critiche. Le altre restano in elenco, e apri il ticket tu quando decidi di intervenire.
        severity_ignore: "Se convivi con un rischio, mettilo tra le ignorate: non tornerà a farsi vedere al controllo successivo."
