        # CYRA-810 — un file delle dipendenze che la scansione non è riuscita a leggere non dice
        # «nessun problema», dice «non lo so». Finché resta così l'elenco è incompleto, e la pagina
        # deve dirlo: senza, chi legge crede che quel pezzo di progetto sia pulito.
