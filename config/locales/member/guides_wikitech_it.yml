      wikitech:
        title: Wikitech
        subtitle: Come salvare gli strumenti tech visti in giro e ritrovarli con una domanda.
        open: Apri Wikitech
        what_title: A cosa serve
        what_intro: "Wikitech raccoglie strumenti, librerie e progetti open source che hai visto in giro e che non riguardano i tuoi progetti. Per il sapere sui tuoi progetti c'è la knowledge base."
        what_b1: Salvi un testo che parla di uno strumento. Wikitech ne tiene solo la parte tecnica e toglie saluti, pubblicità e commenti.
        what_b2: Ogni progetto nominato diventa una scheda. Se la scheda c'è già, si arricchisce invece di raddoppiare.
        what_b3: Quando il progetto ha un repository su GitHub, Wikitech controlla che esista e mostra licenza, stelle e linguaggio.
        steps_title: Come si usa
        steps_intro: Bastano due gesti, salvare e chiedere.
        step1: Premi Salva nozione e incolla il testo, con da dove viene e i suoi link. Dopo poco compaiono le schede.
        step2: Nella casella Chiedi a Wikitech scrivi una domanda normale, per esempio «esiste qualcosa per tracciare i ticket?».
        step3: La risposta cita solo schede che hai davvero. Se non ce n'è nessuna adatta, te lo dice.
        terminal_title: Dal terminale
        terminal_intro: "Le stesse cose si fanno con cyi: wikitech add salva, wikitech search cerca, wikitech show apre una scheda, wikitech ask fa una domanda."
        terminal_b1: Rimandare la stessa nozione non crea doppioni, quindi uno script può riprovare senza danni.
        terminal_b2: Ogni comando ha l'uscita --json per gli script.
        terminal_b3: Vedi solo le schede della tua organizzazione.
