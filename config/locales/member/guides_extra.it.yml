      crons:
        title: "Lavori programmati"
        subtitle: "Accorgersi quando un lavoro che deve girare da solo smette di girare."
        what_title: "Cosa sono"
        what_intro: "Un lavoro programmato è qualcosa che parte da solo a intervalli: un salvataggio notturno, un invio di email, una pulizia. Qui non lo si fa partire: si viene avvisati quando NON parte."
        what_b1: "Il lavoro dice «sono partito» a ogni giro, e se smette di dirlo qualcuno se ne accorge."
        what_b2: "Tu dichiari ogni quanto dovrebbe partire e quanto ritardo è accettabile."
        what_b3: "Se è partito ma è andato male, può dire anche perché."
        words_title: "Due parole che sembrano uguali"
        setup_title: "Come si comincia"
        setup_intro: "Non c'è niente da creare qui: il lavoro compare in elenco la prima volta che si fa vivo. Le istruzioni con l'indirizzo e il comando pronto stanno in una pagina sua."
        cta: "Apri i lavori programmati"
      logs:
        title: "Log"
        subtitle: "Raccogli in un unico posto i messaggi delle tue app e cercali quando serve."
        what_title: "Cosa sono i log"
        what_intro: "I log sono i messaggi che le tue app scrivono mentre funzionano: informazioni, avvisi ed errori. Qui li raccogli tutti insieme e li consulti quando qualcosa non torna."
        what_b1: "Un unico flusso con i messaggi di tutte le tue app."
        what_b2: "Filtri per livello, ambiente, progetto e testo per trovare subito ciò che cerchi."
        what_b3: "Quando una richiesta ha un identificativo, i suoi messaggi si collegano da soli agli errori e agli altri messaggi della stessa richiesta."
        setup_title: "Come iniziare"
        setup_step1: "Crea un progetto e aprilo per ottenere il codice di collegamento."
        setup_step2: "Aggiungi il pacchetto alla tua app e configuralo col codice di collegamento e il Project ID:"
        setup_step3: "Da quel momento i messaggi arrivano da soli. L'indirizzo a cui vengono inviati è"
        cta: "Apri i log"
      servers:
        title: "Monitoraggio server"
        subtitle: "Tieni sotto controllo i tuoi server da un'unica pagina."
        what_title: "Cos'è il monitoraggio server"
        what_intro: "Mostra lo stato di salute dei tuoi server — quanto sono carichi, se hanno spazio e se i servizi funzionano — così te ne accorgi prima che diventi un problema."
        what_b1: "Lo stato di tutti i server a colpo d'occhio."
        what_b2: "Storico di CPU, memoria, disco e temperatura."
        what_b3: "Avvisi quando un server smette di rispondere o un servizio si ferma."
        setup_title: "Come iniziare"
        setup_step1: "Apri la pagina Server e crea un codice per l'agente."
        setup_step2: "Installa l'agente sul server con le istruzioni che ti vengono mostrate."
        setup_step3: "Entro un minuto il server compare nella pagina con i suoi dati."
        cta: "Apri i server"
      analytics:
        title: "Statistiche del sito"
        subtitle: "Scopri quante persone visitano il tuo sito e da dove arrivano."
        what_title: "Cosa sono le statistiche"
        what_intro: "Ti dicono quante visite e quanti visitatori ha il tuo sito, quali pagine sono più viste e da dove arriva il traffico — nel rispetto della privacy, senza cookie."
        what_b1: "Visite e visitatori in tempo reale."
        what_b2: "Pagine più viste e provenienza del traffico."
        what_b3: "Nessun cookie e nessun dato personale raccolto."
        setup_title: "Come iniziare"
        setup_step1: "Scegli il progetto del sito che vuoi misurare. Compaiono solo i progetti con la piattaforma Web e la raccolta delle statistiche attiva."
        setup_step2: "Copia questo codice e incollalo nelle pagine del tuo sito, dentro l'intestazione. È già compilato per il progetto che hai scelto."
        setup_step3: "Apri le statistiche del progetto: la prima visita compare in pochi secondi."
        apply: "Applica"
        pick_project: "Scegli un progetto"
        copy: "Copia"
        copied: "Copiato"
        project_placeholder: "IL_TUO_PROGETTO"
        no_project: "Non c'è ancora un progetto di cui misurare il sito: serve un progetto con la piattaforma Web e la raccolta delle statistiche attiva. Il codice qui sotto resta valido, con i tuoi dati al posto dei segnaposto."
        no_project_link: "Vai ai progetti"
        token_where: "La chiave nel codice è quella del progetto scelto."
        token_link: "Gestisci i codici del progetto"
        token_locked: "Al posto della chiave vera trovi un segnaposto: la chiave la vede chi gestisce i codici di quel progetto. Chiedigliela e sostituiscila prima di pubblicare."
        cta: "Apri le statistiche"
        cta_no_project: "Scegli un progetto"
      secrets:
        title: "Secret dell'organizzazione"
        subtitle: "Conserva le informazioni sensibili e delegale ai progetti giusti."
        what_title: "Cosa sono i secret dell'organizzazione"
        what_intro: "Sono le variabili sensibili dell'organizzazione — chiavi, password, token — conservate in modo sicuro e disponibili ai progetti a cui le deleghi, senza copiarle in giro."
        what_b1: "Valori cifrati e mostrati sempre mascherati."
        what_b2: "Un valore diverso per ogni ambiente (produzione, staging…)."
        what_b3: "Storico delle modifiche con possibilità di ripristino."
        what_b4: "Visibili solo ai progetti a cui le deleghi, non a tutto il team."
        setup_title: "Come iniziare"
        setup_step1: "Apri i secret dell'organizzazione e aggiungi una variabile con il suo nome."
        setup_step2: "Inserisci il valore per ciascun ambiente in cui serve."
        setup_step3: "Delega la variabile ai progetti che devono utilizzarla e revocala quando vuoi; poi leggila dall'applicazione con il comando già pronto in fondo alla pagina — sul computer, nelle build automatiche o sul server."
        cta: "Apri i secret dell'organizzazione"
      knowledge:
        title: "Knowledge base"
        subtitle: "Raccogli note, decisioni e guide del progetto in pagine cercabili."
        what_title: "Cos'è la knowledge base"
        what_intro: "È lo spazio dove il team scrive e ritrova le informazioni del progetto: appunti, decisioni prese e guide, tutto cercabile anche per significato."
        what_b1: "Pagine per progetto: note, decisioni e guide."
        what_b2: "Ricerca che capisce il significato, non solo le parole esatte."
        what_b3: "Suggerimenti di pagine collegate su ticket ed errori."
        setup_title: "Come iniziare"
        setup_step1: "Apri la Knowledge base del progetto."
        setup_step2: "Crea una pagina scegliendo se è una nota, una decisione o una guida."
        setup_step3: "Scrivi il contenuto e salva: sarà subito cercabile dal team."
        links_title: "Collegare le pagine tra loro"
        links_intro: "Mentre scrivi puoi rimandare a un'altra pagina mettendone il titolo tra doppie parentesi quadre. Al salvataggio diventa un collegamento cliccabile."
        links_example: "Esempio: scrivi [[Deploy Kamal]] e chi legge arriva a quella pagina con un clic."
        links_b1: "Ogni pagina mostra a lato cosa collega e chi la cita."
        links_b2: "Se rinomini la pagina di arrivo, il collegamento continua a funzionare."
        links_b3: "Se il titolo non esiste ancora, resta testo normale: niente collegamenti rotti."
        books_title: "Le raccolte"
        books_intro: "Una raccolta mette in fila più pagine nell'ordine che scegli tu: a sinistra l'indice, a destra la pagina aperta. Serve quando le pagine si leggono una dopo l'altra, come un manuale o un percorso per chi inizia."
        books_b1: "L'ordine in cui scegli le pagine è quello che vede chi legge."
        books_b2: "Una raccolta può tenere insieme pagine di progetti diversi."
        books_b3: "Una pagina sta in una raccolta sola: non viene copiata in giro."
        reread_title: "Quando una pagina va riletta"
        reread_intro: "Una decisione o una guida non resta vera per sempre: il sistema che descrive può cambiare o sparire. Ogni pagina di questi due tipi riceve una data entro cui va riguardata — sei mesi per una decisione, un anno per una guida. Le note non scadono."
        reread_b1: "Passata la data la pagina si trova ancora: appare segnata come da rivedere, non sparisce."
        reread_b2: "Le pagine da rileggere si raccolgono nella pagina Revisione, dove confermi che sono ancora vere."
        reread_b3: "Se invece la correggi, la data riparte da sola: non devi confermare niente."
        cta: "Apri la knowledge base"
      tickets:
        title: "Tipi di ticket"
        subtitle: "Bug, story, task ed epic: quale scegliere e come raccogliere il lavoro grosso."
        what_title: "I quattro tipi"
        what_intro: "Ogni ticket ha un tipo. Serve a capire a colpo d'occhio di che lavoro si tratta e a filtrare le liste. Il tipo si sceglie quando apri il ticket e si può cambiare dopo."
        what_b1: "Qualcosa non funziona come dovrebbe."
        what_b2: "Valore nuovo o migliorato per chi usa il prodotto."
        what_b3: "Lavoro tecnico che chi usa il prodotto non vede."
        what_b4: "Un obiettivo grosso che raccoglie altri ticket."
        setup_title: "Come usare le epic"
        setup_step1: "Apri un ticket e scegli come tipo Epic: è il contenitore."
        setup_step2: "Apri i ticket del lavoro vero e, nel campo Epic, scegli l'epic appena creata. Deve essere dello stesso progetto."
        setup_step3: "Sulla pagina dell'epic vedi l'elenco dei ticket che contiene e quanti sono già chiusi."
        rules_title: "Cosa non si può fare"
        rules_b1: "Un'epic non può stare dentro un'altra epic: si scende di un livello solo."
        rules_b2: "Un ticket può stare solo sotto un'epic del suo stesso progetto."
        rules_b3: "Finché un'epic contiene ticket non puoi cambiarle tipo: prima stacca i figli."
        rules_b4: "Se cancelli un'epic, i ticket che conteneva restano: perdono solo il collegamento."
        cta: "Apri i ticket"
