  seo:
    vitals:
      lab: Lab
      field: Field
      lab_explainer: "A test run on a Google machine over a simulated network: it says WHY the site is slow, and it can be repeated identically. It is not what your visitors lived through."
      field_explainer: "What actually happened to the people who opened the site: it says HOW slow it is for them. This is the number Google uses for ranking, and it cannot say why."
      percentile: "Three visits out of four went at least this well. We look at this instead of the average because an average hides exactly the visits that went badly."
