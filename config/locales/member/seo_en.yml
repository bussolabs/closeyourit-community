      from: Found on
      hops: Hops
      chain: Path
      canonical: Canonical
      directives: Directives
      found: Found
      words: Words
      without_alt: Without description
      total: Total
      length: Length
      title: Title
      h1s: H1 headings
      ms: Milliseconds
      bytes: Size
      groups: Groups
      urls: Addresses
      pairs: Pairs
      reason: Reason
    checks:
      noindex:
        label: The page asks not to be indexed
        explanation: The page carries a "noindex" instruction, which asks search engines not to show it. If the page is meant to be found, that instruction has to go.
        expected: The page no longer carries the noindex instruction.
      blocked_by_robots:
        label: Page disallowed by robots.txt but listed in the sitemap
        explanation: The site asks to index this page in its sitemap and forbids reading it in robots.txt. The two instructions contradict each other, and the one that excludes it wins.
        expected: The page is consistent — either out of the sitemap, or no longer disallowed.
      broken_link:
        label: The page does not respond
        explanation: There is nothing at this address any more, or the server errors out. Anyone arriving from a link or from search results finds a closed door.
        expected: The address responds again, or redirects to where the content moved.
      redirect_loop:
        label: Endless redirect
        explanation: The address points to another one that points back, forever. Nobody reaches the page, search engines included.
        expected: The address leads to a page instead of going in circles.
      redirect_chain:
        label: Too many hops before arriving
        explanation: Reaching the page goes through several intermediate addresses. Every hop costs time and dilutes the value of incoming links.
        expected: The address reaches the final page in a single hop.
      canonical_missing:
        label: The page's official address is missing
        explanation: The canonical tells engines which address is the right one when the same content is reachable by several paths. Without it, they decide on their own.
        expected: The page declares its own official address.
      canonical_points_elsewhere:
        label: The official address points to another page
        explanation: The page is in the sitemap, so the site wants it in results, yet it declares a different address as canonical. That takes it out of results.
        expected: The page declares itself as canonical, or leaves the sitemap.
      sitemap_unreachable:
        label: The sitemap does not respond
        explanation: The sitemap is the list of pages the site wants found. If it does not respond, engines have to guess what exists.
        expected: The sitemap responds and lists the site's pages.
      robots_unreachable:
        label: robots.txt does not respond
        explanation: It is the file that tells crawlers where they may go. Without it, every crawler decides for itself.
        expected: The robots.txt file responds.
      missing_from_sitemap:
        label: Page outside the sitemap
        explanation: The page is reachable by browsing but is not in the list the site declares. It gets found later and treated as less important.
        expected: The page appears in the sitemap.
      orphan_page:
        label: Page nobody links to
        explanation: The page is in the sitemap but no other page links to it. Visitors never reach it, and for engines it is worth as much as the links it receives — none.
        expected: At least one page of the site links to this one.
      missing_title:
        label: The title is missing
        explanation: The title is the line shown in search results. Without one, the engine makes it up from the content.
        expected: The page has a title that says what it is about.
      title_too_long:
        label: Title too long
        explanation: Past a certain length the title gets cut in results, and the important part can end up outside.
        expected: The title fits the length engines display.
      duplicate_title:
        label: The same title on several pages
        explanation: Two or more pages introduce themselves with the same title. Readers cannot tell which one to open, and engines treat them as copies.
        expected: Every page has its own title.
      missing_meta_description:
        label: The description is missing
        explanation: It is the text under the title in search results. Without it, the engine grabs an arbitrary piece of the page.
        expected: The page has a description written for it.
      duplicate_meta_description:
        label: The same description on several pages
        explanation: Several pages show the same text in results, which does not help anyone choose.
        expected: Every page has its own description.
      missing_h1:
        label: The main heading is missing
        explanation: The H1 is the big heading at the top of the content. It tells readers and engines what the page is about. A green score does not notice — that check is not one it runs.
        expected: The page has a main heading.
      multiple_h1:
        label: More than one main heading
        explanation: With several H1s it is unclear what the page is actually about.
        expected: The page has a single main heading.
      missing_jsonld:
        label: The home page has no structured data
        explanation: Structured data tells engines who you are and what you do, and enables rich results. On the home page it matters more than anywhere else.
        expected: The home page declares its structured data.
      lang_missing:
        label: The page does not declare its language
        explanation: Without a declared language, engines and screen readers have to guess it.
        expected: The page declares its language.
      hreflang_not_reciprocal:
        label: Language versions do not answer each other
        explanation: One page points to another as its version in a different language, but gets no pointer back. Engines drop the pair and the two pages keep competing.
        expected: Linked pages declare each other.
      hreflang_missing_x_default:
        label: The default version is missing
        explanation: It says which page to show to someone who speaks none of the declared languages.
        expected: Multilingual pages declare a default version.
      thin_content:
        label: Nearly empty page
        explanation: There is too little text for an engine to work out what the page is about and show it to anyone.
        expected: The page has enough content to explain what it covers.
      images_without_alt:
        label: Images without a description
        explanation: The image description serves people who cannot see it and engines trying to understand it. Without one, the image is mute.
        expected: Every meaningful image has its description.
      slow_response:
        label: The page responds slowly
        explanation: The server takes too long to answer. Visitors leave before seeing it.
        expected: The page responds within normal times.
      oversized_html:
        label: Page too heavy
        explanation: The page markup is enormous. On a slow connection that becomes a wait.
        expected: The page has a reasonable size.
      mixed_content:
        label: Insecure resources on a secure page
        explanation: The page is served securely but loads images or scripts in the clear. Browsers block or warn, and what is blocked does not exist for the engine.
        expected: Every resource on the page is served securely.
