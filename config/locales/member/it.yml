    guides:
      back: Guide
      index:
        title: Guide
        help_title: "Come collegare le tue app e usare ogni funzione."
        intro: Collega le tue app a CloseYourIt e sfrutta al meglio il monitoraggio. Ogni guida spiega cosa fa la funzione e i passi esatti per configurarla.
        errors:
          title: Errori
        uptime:
          title: Uptime
        performance:
          title: Performance
        replays:
          title: Session replay
      errors:
        title: Errori
        subtitle: Raccogli gli errori delle tue applicazioni, da qualunque linguaggio siano scritte.
        what_title: Cos'è
        what_intro: CloseYourIt cattura le eccezioni della tua app e le raggruppa per messaggio, così lo stesso guasto è una riga sola. Occorrenze uguali confluiscono nella stessa riga, così mille blocchi identici restano un errore solo, con i suoi contatori — non rumore.
        what_levels: Livelli — debug, info, warning, error, fatal.
        what_status: Stato — non risolto, risolto, messo da parte. Un errore risolto che si ripresenta viene riaperto in automatico.
        what_promote: Promuovi a ticket — trasforma un errore in un ticket di bug con un clic.
        connect_title: Collega la tua app
        connect_step1: Apri il progetto, crea un token in Impostazioni, sezione «Token di ingest», e copia il segreto e il Project ID — al kit servono entrambi.
        connect_step3: "Genera un errore. Compare sotto %{space} › %{page} in pochi secondi."
        sdk:
          ruby:
            label: Ruby
            step2: "Aggiungi la gem e configurala con il token e il Project ID:"
            published: "Pubblicata su RubyGems come closeyourit-ruby, versione 0.8.0."
          js:
            label: JavaScript
            step2: "Installa il pacchetto e inizializzalo il prima possibile all'avvio:"
            published: "Pubblicato su npm come @bussolabs/closeyourit-js, versione 0.8.0."
          dart:
            label: Flutter / Dart
            step2: "Aggiungi il pacchetto e inizializzalo prima di avviare l'app:"
            published: "Pubblicato su pub.dev come closeyourit, versione 0.7.0."
        sourcemaps_title: Errori del browser leggibili
        sourcemaps_intro: "Il codice che gira nel browser è compresso: nomi di file e di funzione diventano sigle, e lo stack di un errore si legge come «locale-redirect-yIZlgYBo.mjs». L'errore è vero e il raggruppamento funziona lo stesso, ma capire da dove viene richiede qualche accorgimento."
        sourcemaps_release: "Indica sempre la versione (release) quando inizializzi il kit: sapere da quale build arriva un errore è metà del lavoro."
        sourcemaps_keep: "Conserva le mappe di ogni build in un archivio privato. Caricale con la CLI, indicando lo stesso progetto, release e nome del file generato presenti nell'errore."
        sourcemaps_limit: "Usa cyi artifacts source-maps upload --help per i parametri di caricamento. Nel dettaglio dell'errore puoi confrontare stack ricevuto e ricostruito; i passaggi non ricostruibili restano indicati, senza modificare l'evento originale."
        replays_title: Rivedere cosa è successo
        replays_intro: Le registrazioni mostrano cosa ha fatto una persona sul sito prima di un errore. Non sono attive di default e si accendono per singolo progetto.
        replays_step1: Apri il progetto e vai nelle sue impostazioni.
        replays_step2: "Attiva le registrazioni: la voce compare sui progetti che hanno una piattaforma web."
        replays_step3: "Metti nel sito il codice che chiede di registrare: l'interruttore da solo non basta, e senza il codice non arriva nessuna sessione."
        replays_step4: Dalla pagina di un errore trovi la registrazione della sessione in cui è successo, se ce n'è una.
        replays_note: "Le registrazioni sono pesanti da conservare: si attivano dove servono davvero, non ovunque."
        replays_guide: Vai alla guida delle registrazioni
        affected_title: Chi è stato colpito
        affected_intro: "La colonna «Utenti» conta le persone distinte che hanno incontrato un errore. Finché legge «non tracciato», nessun evento porta con sé l'identità di chi lo ha subìto: non è zero, semplicemente non è mai arrivato."
        affected_how: "Indica l'utente all'SDK prima che l'errore venga catturato. Basta l'id dell'utente — un identificativo stabile; l'email o l'IP non servono e vengono inviati solo se attivi apposta l'invio dei dati personali:"
        affected_count: Da quel momento ogni errore sa chi ha colpito e la colonna «Utenti» mostra le persone distinte — così ordini per gravità reale, non per rumore.
        affected_privacy: "Il conteggio usa un'impronta anonima; email, IP e username non vengono mai salvati. L'id che scegli tu resta visibile sull'occorrenza: usane uno che non riveli dati personali."
        privacy_title: Valori nascosti (privacy)
        privacy_intro: "Alcuni valori (password, token, email e simili) vengono oscurati prima di essere salvati e nella pagina dell'errore compaiono come «Nascosto». È una scelta di riservatezza, non un guasto: il dato sensibile non viene mai conservato."
        privacy_hidden: Dove vedi «Nascosto», il valore è stato tolto di proposito da una regola di riservatezza.
        privacy_paths: "I percorsi dei file (il punto del codice) non vengono oscurati da CloseYourIt: se li vedi nascosti, è lo scrubber del tuo SDK configurato in modo troppo aggressivo."
        privacy_where: "Cosa nascondere si decide nella configurazione dell'SDK dentro il tuo progetto (il filtro dati / before_send): lì allarghi o restringi le regole."
        triage_title: Cosa fare di un errore
        triage_resolve: Risolvi
        triage_resolve_desc: Segna come risolto. Si riapre se si ripresenta.
        triage_ignore: Ignora
        triage_ignore_desc: Metti da parte gli errori rumorosi che non ti interessano.
        triage_reopen: Riapri
        triage_reopen_desc: Riporta attivo un errore messo da parte.
        triage_promote: Promuovi
        triage_promote_desc: Crea un ticket di guasto dall'errore.
        triage_note: "Smistare e trasformare in ticket sono due permessi del tuo ruolo: «%{triage}» e «%{promote}»."
        cta: Vai agli Errori
      uptime:
        title: Uptime
        subtitle: Controlla che i tuoi siti rispondano, e tiene il conto di quando non l'hanno fatto.
        what_title: Cos'è
        what_intro: Un monitor apre un indirizzo del tuo sito a intervalli regolari e annota ogni controllo. Ce n'è uno per ogni ambiente del progetto, così il sito vero e quello di prova si seguono separatamente.
        what_checks: Controlli — a ogni giro, se il sito ha risposto e in quanto tempo.
        what_incidents: Incident — si apre da solo quando i controlli falliscono di fila (due, se non scegli altro) e si chiude appena il sito torna a rispondere.
        what_sla: Disponibilità — la parte di tempo in cui il sito ha risposto, sulle ultime 24 ore, 7 giorni, 30 giorni e un anno, con una striscia di blocchi colorati.
        setup_title: Crea un monitor
        setup_step1: Dichiara l'ambiente sul progetto (es. production) — un monitor può puntare solo a un ambiente dichiarato.
        setup_step2: "Da %{space} › %{page}, clicca Nuovo monitor e compila i campi:"
        setup_step3: Metti in pausa o riprendi un monitor quando vuoi — i monitor in pausa mantengono lo storico ma smettono di controllare.
        field_type: Cosa controllare
        field_type_desc: un sito web, una porta di un server, il nome di un dominio (DNS) o se una macchina
          risponde (ping)
        field_url: URL
        field_url_desc: l'indirizzo da controllare (solo https, raggiungibile da fuori)
        field_environment: Ambiente
        field_environment_desc: un ambiente dichiarato del progetto
        field_method: Metodo
        field_method_desc: GET / HEAD
        field_status: Stato atteso
        field_status_desc: es. 200
        field_interval: Intervallo
        field_interval_desc: ogni quanto controllare (secondi)
        field_timeout: Timeout
        field_timeout_desc: dopo quanto tempo senza risposta il controllo conta come fallito
        field_latency: Risposta lenta
        field_latency_desc: sopra quanti millisecondi avvisarti che è lento, anche se risponde (vuoto = nessun
          avviso)
        name_note: Il nome del monitor è derivato in automatico come Progetto · Ambiente.
        embed_title: Mostra lo stato sul tuo sito
        embed_step1: Pubblica la pagina di stato del monitor (o del gruppo) col pulsante Pubblica. Finché non è pubblicata, non c'è niente da mostrare fuori.
        embed_step2: "Premi Incorpora: si apre una finestra con due pezzi di codice già pronti."
        embed_badge: Riquadro
        embed_badge_desc: una striscia piccola con lo stato, da mettere in fondo alle pagine del sito
        embed_page: Pagina intera
        embed_page_desc: l'intera pagina di stato dentro una pagina del tuo sito
        embed_step3: Copia il codice e incollalo nel tuo sito dove vuoi che compaia. Si aggiorna da solo a ogni caricamento.
        embed_note: Se ritiri la pubblicazione, il codice già incollato smette di mostrare qualcosa. Il codice esce nella lingua che stai usando.
        alert_title: Fatti avvisare quando cade
        alert_intro: "Un monitor registra i guasti, ma non avvisa nessuno da solo: l'ultimo passo è dire chi va avvisato se il sito cade."
        alert_step1: "Apri %{page} e crea una nuova regola."
        alert_step2: Scegli l'evento «Sito non raggiungibile» — lascia il progetto vuoto per coprirli tutti, oppure scegline uno.
        alert_step3: Collega i canali (email, Telegram, webhook) dove vuoi ricevere l'avviso.
        alert_cta: Vai alle Regole di avviso
        cta: Vai a Uptime
      # CYRA-376 — la registrazione delle sessioni non era spiegata da nessuna parte: né cosa vede,
      # né come si accende, né cosa NON finisce nella registrazione.
      replays:
        title: Session replay
        subtitle: La registrazione di cosa ha fatto una persona sul sito, da rivedere come un video.
        what_title: Cos'è
        what_intro: "Il session replay registra la navigazione di chi usa il tuo sito e te la restituisce come un video da riguardare. Serve quando una segnalazione non si riesce a riprodurre: invece di ricostruire i passi a parole, li si guarda."
        what_watch: Guarda la sessione — le pagine aperte una dopo l'altra, con la durata e il momento in cui è iniziata.
        what_errors: Errori nella sessione — se durante la navigazione è successo un errore, dalla registrazione arrivi all'errore e viceversa.
        what_filters: Trova la sessione giusta — filtra per progetto, ambiente, pagina d'ingresso o solo quelle in cui è successo qualcosa.
        setup_title: Come si accende
        setup_intro: "Le registrazioni non partono da sole e non basta l'interruttore: servono due cose insieme, l'interruttore sul progetto e il codice nelle pagine del sito. Con una sola delle due non arriva nessuna sessione, e nessuno te lo segnala."
        setup_step1: Scegli il progetto di cui vuoi registrare le sessioni. Compaiono solo i progetti con la piattaforma Web, perché è lì che le sessioni si registrano.
        setup_step2: "Nelle sue impostazioni attiva l'interruttore «Registra le sessioni»: apre la strada alle registrazioni in arrivo da quel progetto."
        setup_step3: Copia questo codice e incollalo nelle pagine del tuo sito, dentro l'intestazione. È già compilato per il progetto che hai scelto.
        setup_step4: Le sessioni compaiono man mano che le persone navigano. Da quel momento la pagina delle registrazioni le elenca dalla più recente.
        setup_cta: "Impostazioni di %{project}"
        setup_locked: Non hai il permesso di cambiare le impostazioni di questo progetto. Chiedi a chi lo gestisce di attivare l'interruttore.
        apply: Applica
        pick_project: Scegli un progetto
        copy: Copia
        copied: Copiato
        project_placeholder: IL_TUO_PROGETTO
        no_project: "Nessuno dei progetti che vedi ha la piattaforma Web: le sessioni si registrano solo lì. Il codice qui sotto resta valido, con i tuoi dati al posto dei segnaposto."
        no_project_link: Vai ai progetti
        token_where: La chiave nel codice è quella del progetto scelto.
        token_link: Gestisci i codici del progetto
        token_locked: "Al posto della chiave vera trovi un segnaposto: la chiave la vede chi gestisce i codici di quel progetto. Chiedigliela e sostituiscila prima di pubblicare."
        token_missing: "Questo progetto non ha ancora nessun codice attivo, quindi nel riquadro c'è un segnaposto: creane uno e mettilo al suo posto."
        snippet_note: "La prima riga carica la parte che registra davvero la navigazione: senza, il resto continua a funzionare e le registrazioni no, in silenzio. Tienila prima delle altre."
        errors_title: Dall'errore alla registrazione
        errors_intro: Nella pagina di un errore, sotto i dettagli dell'occorrenza, c'è il riquadro della sessione registrata in cui l'errore è successo. Da lì si guarda cosa stava facendo la persona nei momenti prima del guasto, senza cercare la sessione a mano.
        errors_none: "Quando per quell'errore non c'è nessuna registrazione, il riquadro resta e lo dice. Non è un guasto: vuol dire che la registrazione non era accesa, oppure che l'errore non arriva da una navigazione sul sito."
        errors_cta: Vai agli Errori
        privacy_title: Cosa non finisce nella registrazione
        privacy_intro: "Una registrazione è un dato delicato: il prodotto la tratta come tale, e le scelte sono già prese dalla parte prudente."
        privacy_masked: I valori delicati (password, dati di pagamento, campi marcati come riservati) vengono oscurati dal kit sul sito, prima di partire. Qui dentro arrivano già nascosti e non vengono mai ispezionati.
        privacy_user: Di chi ha navigato resta solo un'impronta anonima, non il nome né l'indirizzo email. Serve a riconoscere che due sessioni sono della stessa persona, non a sapere chi è.
        privacy_retention: Le registrazioni si conservano 30 giorni, o quanti ne imposti sul progetto. Passato quel tempo vengono cancellate davvero, video compresi.
        cta: Vai al Session replay
      performance:
        title: Performance
        subtitle: Query e metodi lenti, dalla tua app.
        what_title: Cos'è
        what_intro: "Performance trova i punti lenti della tua app e li raggruppa come gli errori: la stessa lentezza ripetuta è una riga sola, con i suoi tempi."
        what_query: Query lente — le richieste al database, raggruppate per forma e non per i valori che contengono.
        what_method: Metodi lenti — le parti del programma che misuri tu, raggruppate per il nome che gli dai.
        what_aggregates: Tempi — per ogni gruppo quante volte è successo e la durata più breve, più lunga, media e totale.
        connect_title: Collega con la gem
        connect_step1: Crea un token dal progetto, in Impostazioni, sezione «Token di ingest». Si vede una volta sola — conservalo come un segreto.
        connect_step2: "Aggiungi la gem e configurala con il token e il Project ID:"
        connect_step3: La gem manda le misure in sottofondo, senza far aspettare l'app, e toglie i dati personali prima di inviarle.
        issues_title: I rallentamenti trovati da soli
        issues_intro: "Oltre alle query e ai metodi lenti che misuri tu, il monitoraggio riconosce da solo alcune situazioni tipiche mentre l'app lavora. Sono un terzo di quello che vedi in elenco, e portano i nomi meno intuitivi: qui c'è cosa vuol dire ciascuno."
        issues_note: "I primi quattro arrivano dalle applicazioni sul server, gli ultimi tre dalle app mobili: vedrai solo quelli che i tuoi programmi sanno mandare."
        trend_title: Capire se una cosa sta peggiorando
        trend_chart: "Aprendo un rallentamento, il primo grafico è «Durata nel tempo»: ogni barra è quanto ci ha messo l'operazione in quel pezzo di tempo, e l'altezza è il caso peggiore. Il grafico sotto conta invece quante volte è successa: due grafici diversi, perché una cosa può succedere sempre alla stessa frequenza e intanto metterci il doppio."
        trend_compare: "Sopra il grafico c'è la media del periodo scelto e di quanto è cambiata rispetto al periodo precedente della stessa lunghezza: le ultime 24 ore contro le 24 prima. Quando prima non c'era niente da confrontare, viene scritto, invece di mostrare una variazione inventata."
        trend_thresholds: "I tempi sono colorati: verde quando l'operazione è veloce, ambra nel mezzo, rosso quando è lenta. Passando sopra un tempo si leggono le due soglie che hanno deciso quel colore, e dal dettaglio si arriva alle impostazioni del progetto per cambiarle. Ogni progetto ha le sue: per un'operazione interna «lento» può voler dire una cosa diversa che per una pagina pubblica."
        trend_note: "Senza soglie scelte da te valgono quelle predefinite: veloce sotto %{fast}ms, lento da %{slow}ms in su. Il grafico della durata mostra i casi ancora conservati, quindi vede indietro quanto la conservazione del progetto."
        cta: Vai a Performance
