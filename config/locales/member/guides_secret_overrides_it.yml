  member:
    guides:
      index:
        secret_overrides:
          title: Valori su misura
      secret_overrides:
        title: Valori su misura
        subtitle: Assegna a una persona un valore diverso da quello del progetto, e solo a lei.
        what_title: Che cos'è
        what_intro: Le password e gli indirizzi che i programmi di un progetto leggono per collegarsi ai servizi sono uguali per tutti quelli che possono scaricarli. A volte a una persona serve qualcosa di diverso, e cambiarlo per tutti sarebbe sbagliato. Con un valore su misura lo cambi per lei sola.
        what_case_db: Chi sviluppa e lavora su una copia sua della banca dati, mentre il resto della squadra usa quella comune.
        what_case_mail: Chi prova le email e le vuole ricevere sulla propria casella di prova, non su quella del progetto.
        what_case_extra: Chi ha bisogno di un'impostazione in più, che nel progetto non esiste affatto.
        setup_title: Come si assegna
        setup_step1: Apri il progetto, vai alla scheda delle password e da lì ai valori su misura.
        setup_step2: Scegli la persona, l'ambiente e il nome esatto della variabile. La persona si sceglie fra chi quelle password le può già leggere.
        setup_step3: Scrivi il valore e salva. Da quel momento la persona lo riceve quando scarica le password sul suo computer, senza dover fare niente.
        setup_step4: "Quando non serve più, lo togli: quella persona torna al valore standard, subito."
        notes_title: Cosa sapere
        note_only_admin: Lo assegni tu. Chi lo riceve non può cambiarlo, né toglierselo, né assegnarne uno a sé o ad altri.
        note_never_shown: Nella lista si vede a chi è stato assegnato cosa, mai il valore. Il valore lo legge solo la persona a cui è destinato, quando lo scarica.
        note_github: Verso GitHub parte sempre e soltanto il valore standard del progetto. Un valore su misura non finisce mai in una lavorazione automatica, dove lo userebbero tutti.
        note_environments: "Se una persona non può vedere un ambiente, un valore su misura non gliene apre la porta: il limite sugli ambienti viene prima."
        note_audit: Ogni assegnazione e ogni rimozione restano scritte nell'elenco delle attività del progetto, con chi l'ha decisa e per chi.
