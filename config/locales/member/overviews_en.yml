en:
  member:
    overviews:
      subtitles:
        product: The work to do, the team's proposals and how much each person has.
        observability: The errors, the logs and the speed of your applications.
        infrastructure: "Machines, sites and scheduled jobs: what is not working right now."
        alerts: When the system warns you, what it already told you and where it reaches you.
        automation: The machines that work for you and the decisions they are waiting for.
        seo: How search engines see your sites, page by page.
        settings: Who gets in, what they can do and the settings that apply to everyone.
