        title: Connect the site
        subtitle: The steps, the ready-made code and the text to hand to a coding assistant.
        step_key: "Create the site key in the project settings. Only the sites that have a key can write."
        keys_link: Open the project keys
        no_key: "This project has no key yet: the code below keeps a placeholder."
        key_locked: "The key is shown to whoever manages the project keys. The code below keeps a placeholder: ask an administrator."
        step_code: "Paste this form into the site's page. It works as written."
        code_note: "The key is public: it can sit in the page's code. Change the form's texts freely."
        step_prompt: "Hand this text to a coding assistant: it builds the form in your site's own style."
        step_try: "Write a test request from the site: it shows up here within seconds."
        copy: Copy
        copied: Copied
        prompt: |-
          Add a "Need help?" form to this site that sends the visitors' requests to CloseYourIt.

          Call
          - POST %{endpoint}
          - Headers: Content-Type: application/json and X-Sentry-Auth: Sentry sentry_key=%{key}
          - It starts from the visitor's browser. The key is public: it can sit in the page's code.

          JSON body
          - message: required, plain text, 4000 characters at most.
          - email: optional. When present it must be a valid address.
          - page_url: the address of the page the visitor writes from.
          - website: a trap field for robots. Hidden from people, always empty. Do not remove it.

          Answers
          - 202: request received. Show a thank-you and clear the form.
          - 422: message missing or too long, or email not valid. Show the error next to the field.
          - 403: the site is not allowed or the help desk is off. Show a generic error.
          - 429: too many requests. Ask to try again in a minute.

          Rules
          - Use the components and the style the site already has. No new libraries.
          - Label the email as optional and say it is only used to answer.
          - Do not promise a confirmation email: none is sent.
          - Send no personal data beyond the fields listed.
          - The form must work from the keyboard and have a label for every field.
          - Add a test that covers the successful send and the 422 error.
