it:
  member:
    nav:
      # CYRA-356 — la voce diceva «Replays» e apriva una pagina intitolata «Session replay»: due nomi
      # per la stessa cosa, e nessuno dei due era quello dell'altro. Vince il nome della funzione, che
      # è quello scritto anche nelle impostazioni del progetto e sul sito.
      #
      # CYRA-584 — al nome canonico segue la parola con cui la funzione si CERCA. «Session replay» è
      # il nome voluto dal glossario, ma non contiene nessuna delle parole che uno ha in testa
      # («registrazioni», «visite», «come si muovono le persone»): chi la cercava leggeva il menu
      # intero senza un aggancio. La qualifica non rinomina niente — il titolo della pagina, le
      # impostazioni del progetto e il sito continuano a dire «Session replay».
      #
      # Il separatore è l'interpunto, quello già usato da «Valhalla · God mode», e non è una scelta di
      # gusto: la voce sta in 180 px e col trattino lungo il testo ne misura 178,5 (Inter 12,5 px), un
      # margine e mezzo di pixel che il primo font di ripiego si mangia — la parola con cui la funzione
      # si cerca finirebbe troncata proprio dove serve. Con l'interpunto sono 169,6.
      replays: Session replay · registrazioni
