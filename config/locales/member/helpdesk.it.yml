        no_key: "Questo progetto non ha ancora una chiave: nel codice qui sotto resta un segnaposto."
        key_locked: "La chiave la vede chi gestisce i codici del progetto. Nel codice qui sotto resta un segnaposto: chiedila a un amministratore."
        step_code: "Incolla questo modulo nella pagina del sito. Funziona così com'è."
        code_note: "La chiave è pubblica: può stare nel codice della pagina. I testi del modulo si cambiano liberamente."
        step_prompt: "Dai questo testo a un assistente che scrive codice: costruisce il modulo con lo stile del tuo sito."
        step_try: "Scrivi una richiesta di prova dal sito: compare qui entro pochi secondi."
        copy: Copia
        copied: Copiato
        prompt: |-
          Aggiungi a questo sito un modulo «Serve aiuto?» che manda le richieste dei visitatori a CloseYourIt.

          Chiamata
          - POST %{endpoint}
          - Intestazioni: Content-Type: application/json e X-Sentry-Auth: Sentry sentry_key=%{key}
          - Parte dal browser del visitatore. La chiave è pubblica: può stare nel codice della pagina.

          Corpo JSON
          - message: obbligatorio, testo semplice, massimo 4000 caratteri.
          - email: facoltativa. Se presente deve essere un indirizzo valido.
          - page_url: l'indirizzo della pagina da cui si scrive.
          - website: campo trappola per i robot. Nascosto alle persone, sempre vuoto. Non toglierlo.

          Risposte
          - 202: richiesta ricevuta. Mostra un ringraziamento e svuota il modulo.
          - 422: messaggio mancante o troppo lungo, oppure email non valida. Mostra l'errore accanto al campo.
          - 403: il sito non è fra quelli ammessi o l'assistenza è spenta. Mostra un errore generico.
          - 429: troppe richieste. Chiedi di riprovare fra un minuto.

          Regole
          - Usa i componenti e lo stile che il sito ha già. Niente librerie nuove.
          - Etichetta l'email come facoltativa e spiega che serve solo per rispondere.
          - Non promettere un'email di conferma: non ne parte nessuna.
          - Non mandare altri dati personali oltre a quelli elencati.
          - Il modulo deve funzionare da tastiera e avere un'etichetta per ogni campo.
          - Aggiungi un test che copre l'invio riuscito e l'errore 422.
