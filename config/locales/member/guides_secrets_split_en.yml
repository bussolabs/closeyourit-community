en:
  member:
    guides:
      # CYRA-446 — see the Italian file: one source for the opening line of both secrets guides.
      secrets_split:
        title: Where a secret goes
        intro: "The Vault and organization secrets are not two alternatives: the first contains the second."
        vault_line: "The area that gathers every secret, split into three spaces — your personal ones, the organization's and those of a single project — and shows their state: who touched them and which ones need changing."
        secrets_line: "One of the Vault's three spaces: the values more than one project needs, with a different value for each environment. You delegate them to the projects that must use them and revoke them whenever you want, without copying them around."
        rule: "In practice, before saving ask who needs the value: if only you need it, it goes in your personal secrets; if one project needs it, in that project's secrets; if more than one project needs it, in organization secrets, delegated to the right ones. In the wrong place it is read by people who should not see it."
        open_vault: Open the Vault guide
        open_secrets: Open the organization secrets guide
