en:
  agents:
    council:
      ticket_body: |
        **Problem:** %{problem}

        **Proposed solution:** %{solution}

        **Risk:** %{risk}

        **Proposed by:** %{proposer} · **%{critic}'s vote:** %{vote} (risk %{critic_risk}) — %{reason}

        **Implemented by:** %{engine} %{model}
      engine_default: organization's default choice
      activity_actor: Council
      errors:
        not_found: Council slice not found
        closed: This council slice is already closed
    supporter:
      errors:
        not_found: Question round not found.
        disabled: The supporter is switched off on this project.
        no_service_account: The machine has no service account to answer with.
        stale: The questions changed meanwhile. Take the updated round.
        not_settled: The answers were not recorded. The round stays with a person.
        plan_not_found: Plan not found.
        plan_stale: The plan changed or was already decided. Take the updated plan.
        consult_not_found: Workflow not found.
        consult_stale: The workflow moved or was already decided. Take the updated one.
      activity_actor: Supporter
      plan_revision_intro: "The supporter asks to revise the plan before approval:"
    # CYRA-675 — fixed-length service line, same reason as the clarification one: a comment has a
    # character cap and the agent summary does not. The full summary is in the Automation panel.
    closer_staging:
      already_merged: "The approved PR #%{number} is already merged: the work must not be redone. Check whether it is already in a release, then close the work."
    already_done:
      service_line: "Whoever was to plan this found the work already done in the code: the ticket closes without planning. What was looked at is in the Automation panel."
    clarifications:
      ask:
        # Service line: it ANNOUNCES the questions, it does not contain them. See the Italian file
        # for the reason — the length is part of the contract and `ask_spec` checks it in every
        # locale against Ticketing::Constants::COMMENT_MAX_CHARS.
        service_line:
          one: "An answer is needed: the question is in the Automation panel. Reply with a comment below and the work resumes on its own."
          other: "Answers are needed: the %{count} questions are in the Automation panel. Reply with a comment below and the work resumes on its own."
