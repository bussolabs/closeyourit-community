it:
  agents:
    council:
      ticket_body: |
        **Problema:** %{problem}

        **Soluzione proposta:** %{solution}

        **Rischio:** %{risk}

        **Proposta da:** %{proposer} · **Voto di %{critic}:** %{vote} (rischio %{critic_risk}) — %{reason}

        **Chi lo implementa:** %{engine} %{model}
      engine_default: scelta generale dell'organizzazione
      activity_actor: Consiglio
      errors:
        not_found: Giro del consiglio non trovato
        closed: Questo giro del consiglio è già chiuso
    supporter:
      errors:
        not_found: Giro di domande non trovato.
        disabled: Il supporter è spento su questo progetto.
        no_service_account: La macchina non ha un utente di servizio con cui rispondere.
        stale: Le domande sono cambiate nel frattempo. Riprendi il giro aggiornato.
        not_settled: Le risposte non sono state registrate. Il giro resta a una persona.
        plan_not_found: Piano non trovato.
        plan_stale: Il piano è cambiato o è già stato deciso. Riprendi il piano aggiornato.
        consult_not_found: Lavorazione non trovata.
        consult_stale: La lavorazione si è mossa o è già stata decisa. Riprendi quella aggiornata.
      activity_actor: Supporter
      plan_revision_intro: "Il supporter chiede di rivedere il piano prima dell'approvazione:"
    # CYRA-675 — riga di servizio a lunghezza FISSA, come quella dei chiarimenti e per lo stesso
    # motivo: il riassunto dell'agente non ha un tetto e un commento sì. Il riassunto per esteso sta
    # nella scheda Automazione, i file provati nella cronologia.
    closer_staging:
      already_merged: "La PR #%{number} approvata risulta già unita: il lavoro non va rifatto. Controlla se è già in un rilascio, poi chiudi la lavorazione."
    already_done:
      service_line: "Chi doveva pianificare ha trovato questo lavoro già fatto nel codice: il ticket si chiude senza pianificare. Cosa ha guardato è nella scheda Automazione."
    # CYRA-1327 — i tentativi sono finiti due volte. Righe a lunghezza FISSA per lo stesso motivo
    # della riga qui sopra: un commento ha un tetto di caratteri, il motivo tecnico no. Il motivo
    # tecnico sta nella scheda Automazione.
    exhausted_budget:
      service_line: "Le macchine hanno finito i tentativi due volte: il ticket torna tra quelli da fare e non riparte da solo. Cosa è stato provato, e il pulsante per riavviare, sono nella scheda Automazione."
      eligibility_reason: "Le macchine hanno finito i tentativi due volte su questo ticket. Per rimetterlo in lavorazione non basta consentirlo qui: va anche riavviato dalla scheda Automazione."
    clarifications:
      ask:
        # Riga di servizio: ANNUNCIA le domande, non le contiene. Le domande sono righe loro e si
        # leggono nella scheda Domande — un commento ha un tetto di caratteri e tre domande da
        # 180 non ci starebbero. La lunghezza qui è parte del contratto: `ask_spec` la verifica in
        # ogni lingua contro Ticketing::Constants::COMMENT_MAX_CHARS.
        service_line:
          one: "Serve una risposta: la domanda è nella scheda Automazione. Rispondi con un commento qui sotto e la lavorazione riprende da sola."
          other: "Servono risposte: le %{count} domande sono nella scheda Automazione. Rispondi con un commento qui sotto e la lavorazione riprende da sola."
    # CYRA-1329 — perché una lavorazione è ferma, in una riga, per chi deve decidere (coda e
    # terminale). Il motivo salvato è audit in una lingua sola: la frase si compone qui dai campi.
    stop_reason:
      attempt_limit: "Ha finito i tentativi sul passo «%{phase}»: non riprova più da sola."
      # CYRA-1330 — la revisione non ha mai risposto: dire che ha finito i tentativi conterebbe
      # bocciature che non ci sono.
      review_fault: "La revisione del passo «%{phase}» non si è potuta fare per un guasto tecnico, più volte di fila: non riprova più da sola."
      agent_blocked: "Si è fermata da sola sul passo «%{phase}»: %{reason}"
      candidate_check: "Il controllo della proposta non è andato a buon fine: %{reason}"
      release_probe: "Il controllo del rilascio non è andato a buon fine: %{reason}"
      held_by_person: "L'ha fermata %{name} prima del rilascio sul sito vero."
      production_approval: "Aspetta il via libera di una persona prima del rilascio sul sito vero."
      safety_stop: "Fermata per sicurezza: %{reason} Riparte solo se una persona la sblocca."
      stalled_review: "Il passo «%{phase}» è stato respinto e nessuno lo sta riprovando."
      no_reason: "non ha scritto il motivo"
