# Development uses Solid Cable like production: jobs run in the separate bin/jobs process, and an
# in-process adapter would drop every broadcast they send (server status, alerts, ingest refreshes).
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
