<!doctype html>
<html lang="it">
  <head>
    <title>Richiesta non valida · CloseYourIt</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <!-- CYRA-325 — pagina servita da file statico (Rails non gira): niente sidebar, ma l'aspetto e
         la lingua sono quelli del prodotto, e c'è sempre una via per tornare dove si stava. -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      html { font-size: 16px; }
      body {
        background: #fafaf9;
        color: #18181b;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 2rem;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }
      main {
        width: min(100%, 34rem);
        background: #fff;
        border: 1px solid #e7e5e4;
        border-radius: 12px;
        padding: 2.5rem 2rem;
        text-align: center;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #78716c;
      }
      h1 { margin-top: 0.75rem; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin-top: 0.5rem; font-size: 0.8125rem; color: #57534e; }
      a.button {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.5rem 0.875rem;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
        font-size: 0.8125rem;
        font-weight: 500;
        text-decoration: none;
      }
      a.button:hover { background: #4338ca; }
    </style>
  </head>
  <body>
    <!-- Questo file vive in public/400.html -->
    <main>
      <p class="code">400</p>
      <h1>La richiesta non è valida</h1>
      <p>Il browser ha mandato una richiesta che non siamo riusciti a leggere. Riprova, oppure riparti dalla home.</p>
      <a class="button" href="/">Torna alla home</a>
    </main>
  </body>
</html>
